<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Block</title>
<meta name="description" content="Log the classic mass block. Weights stay on this phone.">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Block">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root {
  --bg: #0b0c0a;
  --bg-2: #121410;
  --surface: #161814;
  --surface-2: #1b1e18;
  --raised: #22251f;
  --fg: #f4f1e8;
  --muted: #a39e90;
  --primary: #c8f54a;
  --primary-fg: #12140c;
  --accent: #c8f54a;
  --line: #2c2f28;
  --line-soft: rgba(200, 245, 74, 0.14);
  --danger: #c4b8a8;
  --shadow: 0 18px 40px rgba(0, 0, 0, 0.38);
  --radius: 1.15rem;
  --radius-sm: 0.85rem;
  --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Times New Roman", Georgia, serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { height: 100%; background: var(--bg); }
body {
  min-height: 100%;
  color: var(--fg);
  font-family: var(--font-sans);
  background:
    radial-gradient(1200px 700px at 80% -10%, rgba(200, 245, 74, 0.08), transparent 55%),
    radial-gradient(900px 500px at 0% 100%, rgba(200, 245, 74, 0.04), transparent 50%),
    linear-gradient(180deg, #10120e 0%, var(--bg) 28%, var(--bg) 100%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
input { border: 0; }
:focus { outline: none; }
:focus-visible { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--primary); }
.tabular { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.display { font-family: var(--font-display); font-weight: 400; letter-spacing: -0.03em; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

.app {
  width: 100%;
  max-width: 32rem;
  margin: 0 auto;
  min-height: 100dvh;
  position: relative;
}

.header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding: calc(1.15rem + var(--safe-top)) 1.25rem 1rem;
  background:
    linear-gradient(180deg, rgba(200, 245, 74, 0.07), rgba(255, 255, 255, 0.04) 36%, transparent 70%),
    rgba(11, 12, 10, 0.58);
  backdrop-filter: blur(22px) saturate(1.4);
  -webkit-backdrop-filter: blur(22px) saturate(1.4);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
}
.brand-kicker {
  margin: 0;
  font-size: 11px;
  letter-spacing: 0.46em;
  text-transform: uppercase;
  color: var(--fg);
  font-weight: 600;
}
.brand-rule {
  margin-top: 0.75rem;
  width: 2.5rem;
  height: 2px;
  background: var(--accent);
  border-radius: 99px;
  box-shadow: 0 0 16px rgba(200, 245, 74, 0.45);
}
.brand-sub {
  margin: 0.75rem 0 0;
  font-size: 10px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--muted);
}
.icon-btn {
  width: 2.75rem;
  height: 2.75rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--fg);
  border-radius: 999px;
  transition: background 0.15s ease, transform 0.15s ease;
}
.icon-btn:hover { background: var(--raised); }
.icon-btn:active { transform: scale(0.96); }
.icon-btn:disabled { opacity: 0.4; }
.icon-btn.solid {
  background: var(--surface);
  box-shadow: inset 0 0 0 1px var(--line);
}

main {
  padding: 0.5rem 1.25rem calc(7.5rem + var(--safe-bottom));
}
.stack { display: flex; flex-direction: column; gap: 1rem; }
.stack-3 { display: flex; flex-direction: column; gap: 0.75rem; }

.date-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
}
.date-center { text-align: center; }
.date-title {
  margin: 0;
  font-family: var(--font-display);
  font-size: 1.6rem;
  line-height: 1;
  letter-spacing: -0.03em;
}
.date-sub {
  margin: 0.3rem 0 0;
  font-size: 0.875rem;
  color: var(--muted);
}

.chips {
  display: flex;
  gap: 0.5rem;
  overflow-x: auto;
  margin: 0 -1.25rem;
  padding: 0.1rem 1.25rem 0.2rem;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto;
  min-width: 4.5rem;
  height: 4rem;
  padding: 0 0.75rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  color: var(--fg);

  box-shadow: inset 0 0 0 1px var(--line);
  transition: background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.chip .name { font-size: 0.875rem; font-weight: 500; letter-spacing: -0.02em; }
.chip .meta { margin-top: 0.25rem; font-size: 0.75rem; color: var(--muted); }
.chip.active {
  background: var(--primary);
  color: var(--primary-fg);
  box-shadow: 0 8px 24px rgba(200, 245, 74, 0.22);
}
.chip.active .meta { color: var(--primary-fg); }

.session-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 0.75rem; }
.session-title {
  margin: 0;
  font-family: var(--font-display);
  font-size: 2.35rem;
  line-height: 0.95;
  letter-spacing: -0.03em;
}
.progress {
  margin: 0;
  padding-bottom: 0.2rem;
  font-size: 0.875rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.note {
  margin: 0.55rem 0 0;
  font-size: 0.875rem;
  line-height: 1.625;
  color: var(--muted);
}

.banner, .card, .rest-card, .empty-card {
  background: linear-gradient(180deg, color-mix(in srgb, var(--surface) 92%, #fff 8%), var(--surface));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.banner {
  margin: 0;
  padding: 0.85rem 1rem;
  font-size: 0.875rem;
  line-height: 1.625;
  color: var(--fg);
  background: linear-gradient(180deg, var(--raised), var(--surface-2));
}
.rest-card, .empty-card { padding: 2rem 1rem; text-align: center; }
.rest-card h3, .empty-card h2, .empty-card h3 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 1.85rem;
  letter-spacing: -0.03em;
}
.rest-card p, .empty-card p {
  margin: 0.5rem 0 0;
  font-size: 0.875rem;
  color: var(--muted);
  line-height: 1.625;
}

.copy-last {
  height: 2.75rem;
  padding: 0 1rem;
  border-radius: 999px;
  background: var(--raised);
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--fg);
  align-self: flex-start;
  box-shadow: inset 0 0 0 1px var(--line);
}

.ex {
  padding: 1rem;
}
.ex-top { display: flex; align-items: flex-start; gap: 0.5rem; }
.ex-name {
  margin: 0;
  flex: 1;
  min-width: 0;
  font-size: 1rem;
  font-weight: 600;
  line-height: 1.3;
}
.ex-idx {
  margin-right: 0.5rem;
  font-family: var(--font-display);
  font-size: 1.25rem;
  color: var(--primary);
  font-variant-numeric: tabular-nums;
}
.ex-actions { display: flex; flex-shrink: 0; gap: 0.25rem; }
.cue {
  margin: 0.3rem 0 0;
  font-size: 0.875rem;
  color: var(--muted);
}
.set-ctrl {
  margin-top: 0.75rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.set-count {
  width: 3.5rem;
  flex-shrink: 0;
  text-align: center;
  font-size: 0.875rem;
  font-variant-numeric: tabular-nums;
}
.field {
  height: 2.75rem;
  min-width: 0;
  flex: 1;
  border-radius: var(--radius-sm);
  background: var(--bg);
  padding: 0 0.75rem;
  color: var(--fg);
  box-shadow: inset 0 0 0 1px var(--line);
}
.field:focus { box-shadow: inset 0 0 0 1px var(--primary); }
.field.center { text-align: center; }
.sets { margin-top: 0.75rem; display: flex; flex-direction: column; gap: 0.75rem; }
.set { display: flex; flex-direction: column; gap: 0.25rem; }
.set-target { display: flex; align-items: center; gap: 0.5rem; }
.set-n { width: 1rem; font-size: 0.875rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.target-wrap {
  display: flex;
  align-items: center;
  height: 2.25rem;
  min-width: 0;
  flex: 1;
  border-radius: var(--radius-sm);
  background: var(--bg);
  box-shadow: inset 0 0 0 1px var(--line);
}
.target-wrap:focus-within { box-shadow: inset 0 0 0 1px var(--primary); }
.target-wrap .lbl { padding-left: 0.75rem; font-size: 0.75rem; color: var(--muted); }
.target-wrap input {
  height: 2.25rem;
  min-width: 0;
  flex: 1;
  background: transparent;
  padding: 0 0.5rem;
  font-size: 0.875rem;
}
.set-row { display: flex; align-items: center; gap: 0.25rem; }
.weight-input, .reps-input {
  height: 2.75rem;
  width: 100%;
  border-radius: var(--radius-sm);
  background: var(--bg);
  text-align: center;
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-variant-numeric: tabular-nums;
  box-shadow: inset 0 0 0 1px var(--line);
}
.weight-input:focus, .reps-input:focus { box-shadow: inset 0 0 0 1px var(--primary); }
.weight-lab { min-width: 0; flex: 1; }
.reps-lab { width: 4rem; flex-shrink: 0; }
.done-btn {
  width: 2.75rem;
  height: 2.75rem;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  background: var(--raised);
  color: var(--muted);
  box-shadow: inset 0 0 0 1px var(--line);
  transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
}
.done-btn.on {
  background: var(--primary);
  color: var(--primary-fg);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--primary) 50%, transparent), 0 0 18px rgba(200, 245, 74, 0.28);
}
.last-time { margin: 0.75rem 0 0; font-size: 0.875rem; color: var(--muted); }

.add-ex p, .section-kicker {
  margin: 0;
  font-size: 0.875rem;
  font-weight: 500;
}
.muscle-row { margin-top: 0.75rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
.pill {
  height: 2.25rem;
  padding: 0 0.75rem;
  border-radius: 999px;
  background: var(--raised);
  color: var(--muted);
  font-size: 0.875rem;
}
.pill.on { background: var(--primary); color: var(--primary-fg); }

.btn-primary, .btn-ghost, .btn-line {
  height: 3rem;
  width: 100%;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  border-radius: 0.9rem;
  transition: opacity 0.15s ease, background 0.15s ease, color 0.15s ease;
}
.btn-primary { background: var(--primary); color: var(--primary-fg); font-weight: 600; }
.btn-primary:disabled { opacity: 0.4; }
.btn-ghost {
  background: transparent;
  color: var(--muted);
  box-shadow: inset 0 0 0 1px var(--line);
}
.btn-ghost.done-session { color: var(--muted); }
.btn-line {
  background: transparent;
  color: var(--fg);
  box-shadow: inset 0 0 0 1px var(--line);
  height: 2.75rem;
  letter-spacing: 0.16em;
}
.mt-2 { margin-top: 0.5rem; }
.mt-3 { margin-top: 0.75rem; }
.mt-4 { margin-top: 1rem; }
.mt-5 { margin-top: 1.25rem; }

.tabbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 20;
  border-top: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: blur(18px) saturate(1.2);
  -webkit-backdrop-filter: blur(18px) saturate(1.2);
}
.tabbar-inner {
  max-width: 32rem;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
}
.tab {
  height: 4rem;
  padding-bottom: var(--safe-bottom);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.2rem;
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  border-top: 2px solid transparent;
}
.tab.active { color: var(--fg); border-top-color: var(--accent); }

.sheet-bg {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: color-mix(in srgb, var(--bg) 80%, transparent);
}
.sheet-dismiss { position: absolute; inset: 0; }
.sheet {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 32rem;
  padding: 1.5rem 1.25rem calc(2rem + var(--safe-bottom));
  background: var(--bg-2);
  border-top: 2px solid var(--accent);
  box-shadow: 0 -24px 60px rgba(0,0,0,0.45);
}
.sheet h2 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 1.85rem;
  letter-spacing: -0.03em;
}
.sheet .hint { margin: 1.25rem 0 0; font-size: 0.875rem; color: var(--muted); }
.unit-grid { margin-top: 0.5rem; display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
.sheet label { display: block; margin-top: 1.25rem; font-size: 0.875rem; color: var(--muted); }
.sheet .clear { margin-top: 1rem; height: 2.75rem; width: 100%; border-radius: 999px; font-size: 0.875rem; color: var(--muted); }
.page-title {
  margin: 0;
  font-family: var(--font-display);
  font-size: 2.35rem;
  line-height: 0.95;
  letter-spacing: -0.03em;
}
.lede { margin: 0.5rem 0 0; font-size: 0.875rem; line-height: 1.625; color: var(--muted); }

.log-row, .lift-row, .vol-row {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 1rem;
  text-align: left;
}
.log-row { padding: 1rem; }
.log-main { flex: 1; min-width: 0; }
.log-main h3 { margin: 0; font-family: var(--font-display); font-size: 1.5rem; line-height: 1; }
.log-main p, .lift-sub { margin: 0.3rem 0 0; font-size: 0.875rem; color: var(--muted); }
.log-right, .lift-right { text-align: right; }
.log-right .num, .lift-right .num {
  margin: 0;
  font-family: var(--font-display);
  font-size: 1.5rem;
  line-height: 1;
  color: var(--primary);
  font-variant-numeric: tabular-nums;
}
.log-right .lbl { margin: 0.25rem 0 0; font-size: 0.75rem; color: var(--muted); }
.log-detail { border-top: 1px solid var(--line); padding: 0.75rem 1rem 1rem; }
.log-detail .vol { margin: 0 0 0.75rem; font-size: 0.875rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.log-detail li { list-style: none; }
.log-detail ul { margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.75rem; }
.log-detail .ex-l { margin: 0; font-size: 0.875rem; font-weight: 500; }
.log-detail .sets-l { margin: 0.25rem 0 0; font-size: 0.875rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.lift-group h3 {
  margin: 0 0 0.5rem;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
}
.lift-list, .history-list { overflow: hidden; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
.lift-row { border-bottom: 1px solid var(--line); }
.lift-row:last-child, .history-list li:last-child { border-bottom: 0; }
.lift-name { flex: 1; min-width: 0; font-size: 0.875rem; font-weight: 500; }
.back-pill {
  height: 2.75rem;
  padding: 0 1rem;
  border-radius: 999px;
  background: var(--surface);
  font-size: 0.875rem;
  box-shadow: inset 0 0 0 1px var(--line);
  align-self: flex-start;
}
.chart {
  height: 10rem;
  padding: 0.75rem 0.5rem;
  color: var(--primary);
}
.chart svg { width: 100%; height: 100%; display: block; }
.history-list li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.75rem 1rem;
  border-bottom: 1px solid var(--line);
}
.history-list .when { font-size: 0.875rem; color: var(--muted); }
.history-list .val { font-family: var(--font-display); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.history-list .val span { margin-left: 0.25rem; font-size: 1rem; color: var(--muted); }

.vol-card { overflow: hidden; }
.vol-top { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; }
.vol-name { margin: 0; font-size: 1rem; font-weight: 500; }
.vol-sets {
  margin: 0;
  font-family: var(--font-display);
  font-size: 1.5rem;
  line-height: 1;
  color: var(--primary);
  font-variant-numeric: tabular-nums;
}
.bar { margin-top: 0.5rem; height: 0.375rem; overflow: hidden; border-radius: 999px; background: var(--bg); }
.bar > span { display: block; height: 100%; border-radius: 999px; background: var(--primary); }
.vol-sources { border-top: 1px solid var(--line); padding: 0.75rem 1rem; margin: 0; list-style: none; }
.vol-sources li { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; padding: 0.25rem 0; font-size: 0.875rem; }
.vol-sources .src-name { min-width: 0; }
.vol-sources .src-day { color: var(--muted); }

.check-sec { padding: 1rem; }
.check-sec h3 { margin: 0; font-family: var(--font-display); font-size: 1.5rem; line-height: 1; }
.check-day { border-top: 1px solid var(--line); padding: 0.75rem 0; }
.check-day:first-of-type { margin-top: 1rem; }
.check-head { display: flex; align-items: baseline; justify-content: space-between; }
.check-head .dow { margin: 0; font-size: 0.875rem; font-weight: 500; }
.check-head .dt { margin: 0; font-size: 0.875rem; font-variant-numeric: tabular-nums; color: var(--muted); }
.check-head .dt.today { color: var(--accent); }
.check-grid, .avg-grid { margin-top: 0.5rem; display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
.avg-grid { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--line); gap: 0.75rem; }
.flabel { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.flabel input {
  margin-top: 0.25rem;
  height: 2.75rem;
  width: 100%;
  background: var(--bg);
  padding: 0 0.75rem;
  text-align: center;
  font-size: 0.875rem;
  letter-spacing: normal;
  text-transform: none;
  font-variant-numeric: tabular-nums;
  box-shadow: inset 0 0 0 1px var(--line);
  border-radius: 0.65rem;
}
.flabel input:focus { box-shadow: inset 0 0 0 1px var(--accent); }
.flabel input:disabled { opacity: 0.4; }
.avg-label { margin: 0; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.avg-val { margin: 0.25rem 0 0; font-family: var(--font-display); font-size: 1.5rem; line-height: 1; font-variant-numeric: tabular-nums; }
.avg-val span { margin-left: 0.25rem; font-family: var(--font-sans); font-size: 0.75rem; color: var(--muted); }

.day-total { border-top: 1px solid var(--line); padding-top: 1rem; }
.kicker {
  margin: 0;
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
}
.kcal {
  margin: 0.5rem 0 0;
  font-family: var(--font-display);
  font-size: 3rem;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.kcal span { margin-left: 0.5rem; font-family: var(--font-sans); font-size: 0.875rem; letter-spacing: normal; color: var(--muted); }
.macro-grid { margin-top: 1rem; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.75rem; }
.macro-l { margin: 0; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.macro-v { margin: 0.25rem 0 0; font-family: var(--font-display); font-size: 1.5rem; line-height: 1; font-variant-numeric: tabular-nums; }
.macro-v span { margin-left: 0.25rem; font-family: var(--font-sans); font-size: 0.75rem; color: var(--muted); }
.meal { padding: 1rem; position: relative; }
.meal.z { z-index: 10; }
.meal-num { margin: 0; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
.meal-name {
  margin-top: 0.25rem;
  width: 100%;
  background: transparent;
  font-family: var(--font-display);
  font-size: 1.5rem;
}
.meal-item { border-top: 1px solid var(--line); padding-top: 0.75rem; margin-top: 0.75rem; }
.meal-item-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem; }
.meal-item-top p { margin: 0; min-width: 0; font-size: 0.875rem; }
.rm { flex-shrink: 0; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.grams-row { margin-top: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
.grams-row input {
  height: 2.75rem;
  width: 6rem;
  background: var(--bg);
  padding: 0 0.75rem;
  text-align: center;
  font-variant-numeric: tabular-nums;
  box-shadow: inset 0 0 0 1px var(--line);
  border-radius: 0.65rem;
}
.grams-row span { font-size: 0.875rem; color: var(--muted); }
.meal-total { margin-top: 1rem; border-top: 1px solid var(--line); padding-top: 0.75rem; }
.search-row { display: flex; align-items: center; gap: 0.5rem; }
.search-row .q { flex: 1; min-width: 0; }
.suggest {
  position: absolute;
  left: 1rem; right: 1rem;
  z-index: 10;
  margin-top: 0.25rem;
  max-height: 14rem;
  overflow-y: auto;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 0.75rem;
}
.suggest button {
  display: flex;
  min-height: 2.75rem;
  width: 100%;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  padding: 0.5rem 0.75rem;
  text-align: left;
  font-size: 0.875rem;
}
.suggest .amt { flex-shrink: 0; color: var(--muted); font-variant-numeric: tabular-nums; }
.suggest .none { padding: 0.75rem; font-size: 0.875rem; color: var(--muted); }
.linkish {
  margin-top: 0.5rem;
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent);
}
.new-food { margin-top: 0.75rem; display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
.new-food .span2 { grid-column: 1 / -1; }
.page-stack { display: flex; flex-direction: column; gap: 1.25rem; }
.page-stack-lg { display: flex; flex-direction: column; gap: 1.5rem; }
.lift-pages { display: flex; flex-direction: column; gap: 1rem; }

.header-actions { display: flex; align-items: center; gap: 0.55rem; }
.sync-dot {
  width: 0.5rem;
  height: 0.5rem;
  border-radius: 99px;
  background: #6d6a60;
  box-shadow: 0 0 0 3px rgba(200, 245, 74, 0);
  flex: 0 0 auto;
}
.sync-dot[data-state="synced"] {
  background: var(--primary);
  box-shadow: 0 0 8px rgba(200, 245, 74, 0.55);
}
.sync-dot[data-state="pending"] {
  background: var(--primary);
  opacity: 0.45;
  box-shadow: 0 0 8px rgba(200, 245, 74, 0.2);
}
.sync-dot[data-state="offline"],
.sync-dot[data-state="error"],
.sync-dot[data-state="idle"] { background: #6d6a60; }
.privacy-note { margin-top: 1.25rem; }

</style>

  if (!t || t.length > 128 || !/^[A-Za-z0-9_-]+$/.test(t)) return "";
  return t;
}

function tokenFromUrl() {
  try { return normalizeToken(new URLSearchParams(location.search).get("c")); }
  catch (err) { return ""; }
}

function rememberedToken() {
  try { return normalizeToken(localStorage.getItem(TOKEN_KEY) || ""); }
  catch (err) { return ""; }
}

function rememberToken(token) {
  try { if (token) localStorage.setItem(TOKEN_KEY, token); }
  catch (err) {}
}

const clientToken = (() => {
  const fromUrl = tokenFromUrl();
  if (fromUrl) { rememberToken(fromUrl); return fromUrl; }
  return rememberedToken();
})();

function storageKey() {
  return clientToken ? STORAGE_KEY + ":" + clientToken : STORAGE_KEY;
}

function esc(v) {
  return String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
}

function pad2(n) { return String(n).padStart(2, "0"); }

function parseDate(s) {
  const [y, m, d] = String(s).split("-").map(Number);
  return new Date(y, m - 1, d);
}

function fmtISO(d) {
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

function today() { return fmtISO(new Date()); }

function addDays(s, n) {
  const d = parseDate(s);
  d.setDate(d.getDate() + n);
  return fmtISO(d);
}

function fmtEEE(s) {
  const d = parseDate(s);
  return `${DOW[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
}

function weekday(s) { return parseDate(s).getDay(); }

function diffDays(a, b) {
  const da = parseDate(a), db = parseDate(b);
  da.setHours(0, 0, 0, 0);
  db.setHours(0, 0, 0, 0);
  return Math.round((da - db) / 86400000);
}

function weekNumber(start, current) {
  return Math.floor(Math.max(0, diffDays(current, start)) / 7) + 1;
}

function isDeload(week) { return week === 5 || week === 6; }

function mondayOf(s) {
  const t = weekday(s);
  return addDays(s, t === 0 ? -6 : 1 - t);
}

function dayById(id) {
  const d = DAYS.find((x) => x.id === id);
  if (!d) throw new Error("Unknown day " + id);
  return d;
}

function dayByWeekday(wd) {
  const d = DAYS.find((x) => x.weekday === wd);
  if (!d) throw new Error("No day for weekday " + wd);
  return d;
}

function defaultMeals() {
  return Array.from({ length: 6 }, (_, i) => ({ id: `meal-${i + 1}`, name: `Meal ${i + 1}`, items: [] }));
}

function normalizeMeals(raw) {
  const base = defaultMeals();
  if (!Array.isArray(raw)) return base;
  return base.map((slot, i) => {
    const r = raw.find((x) => x.id === slot.id) ?? raw[i];
    if (!r) return slot;
    const name = typeof r.name === "string" ? r.name : slot.name;
    const items = Array.isArray(r.items)
      ? r.items.filter((x) => x && typeof x.id === "string" && typeof x.foodId === "string" && Number.isFinite(x.grams))
      : [];
    return { id: slot.id, name, items };
  });
}

function emptySet() { return { weight: "", reps: "", done: false }; }

function sessionId(dayId, date) { return `${dayId}:${date}`; }

function parseNum(v) {
  const t = String(v).trim().replace(",", ".");
  if (!t) return null;
  const n = Number(t);
  return Number.isFinite(n) ? n : null;
}

function adjustWeight(value, step) {
  const n = parseNum(value) ?? 0;
  const r = Math.max(0, Math.round((n + step) * 4) / 4);
  return String(r);
}

function weightStep(unit) { return unit === "kg" ? 2.5 : 5; }

function bestSet(entries) {
  let best = null;
  for (const e of entries ?? []) {
    const w = parseNum(e.weight);
    const r = parseNum(e.reps);
    if (w == null || w <= 0) continue;
    if (!best || w > best.weight || (w === best.weight && (r ?? 0) > best.reps)) {
      best = { weight: w, reps: r ?? 0 };
    }
  }
  return best;
}

function sessionVolume(session) {
  let t = 0;
  for (const sets of Object.values(session.sets)) {
    for (const e of sets) {
      if (!e.done) continue;
      const w = parseNum(e.weight), r = parseNum(e.reps);
      if (w != null && r != null) t += w * r;
    }
  }
  return t;
}

function isLogged(session) {
  if (session.finished) return true;
  return Object.values(session.sets).some((sets) =>
    sets.some((e) => e.done || e.weight.trim() !== "" || e.reps.trim() !== "")
  );
}

function doneCount(session) {
  return Object.values(session.sets).reduce((n, sets) => n + sets.filter((e) => e.done).length, 0);
}

function setRanges(ex) {
  return Array.from({ length: Math.max(1, ex.sets) }, (_, i) => ex.setReps?.[i] ?? ex.reps);
}

function planFor(dayId, plans) {
  return plans[dayId] ?? dayById(dayId).exercises;
}

function clonePlan(dayId, plans) {
  return planFor(dayId, plans).map((e) => ({ ...e, muscles: e.muscles ? [...e.muscles] : [], setReps: e.setReps ? [...e.setReps] : undefined }));
}

function findExercise(id, plans, library) {
  for (const day of DAYS) {
    const hit = (plans[day.id] ?? day.exercises).find((e) => e.id === id);
    if (hit) return hit;
  }
  if (library[id]) return library[id];
  for (const day of DAYS) {
    const hit = day.exercises.find((e) => e.id === id);
    if (hit) return hit;
  }
}

function exerciseMuscles(ex) {
  if (ex.muscles?.length) return ex.muscles;
  for (const day of DAYS) {
    const n = day.exercises.find((t) => t.id === ex.id);
    if (n?.muscles?.length) return n.muscles;
  }
  return [];
}

function fitSets(existing, count) {
  const n = (existing ?? []).slice(0, count);
  while (n.length < count) n.push(emptySet());
  return n;
}

function newSession(dayId, exercises, date, unit) {
  const sets = {};
  for (const ex of exercises) sets[ex.id] = Array.from({ length: ex.sets }, () => emptySet());
  return { id: sessionId(dayId, date), dayId, date, unit, sets, finished: false, updatedAt: Date.now() };
}

function previousSession(sessions, dayId, date) {
  return sessions
    .filter((s) => s.dayId === dayId && s.date < date && isLogged(s))
    .sort((a, b) => (a.date < b.date ? 1 : -1))[0];
}

function liftPoints(sessions, exerciseId) {
  return sessions
    .filter(isLogged)
    .slice()
    .sort((a, b) => (a.date < b.date ? -1 : 1))
    .flatMap((s) => {
      const best = bestSet(s.sets[exerciseId]);
      return best ? [{ label: fmtEEE(s.date), weight: best.weight, reps: best.reps, unit: s.unit }] : [];
    });
}

function csvEscape(v) {
  const t = String(v);
  return /[",\n]/.test(t) ? `"${t.replaceAll('"', '""')}"` : t;
}

function foodById(id, custom) {
  return custom.find((f) => f.id === id) ?? FOODS.find((f) => f.id === id);
}

function scaleMacros(food, grams) {
  const portion = food.portion > 0 ? food.portion : 100;
  const r = (Number.isFinite(grams) ? grams : 0) / portion;
  return { kcal: food.kcal * r, protein: food.protein * r, carbs: food.carbs * r, fat: food.fat * r };
}

function addMacros(a, b) {
  return { kcal: a.kcal + b.kcal, protein: a.protein + b.protein, carbs: a.carbs + b.carbs, fat: a.fat + b.fat };
}

function mealMacros(meal, custom) {
  return meal.items.reduce((acc, item) => {
    const food = foodById(item.foodId, custom);
    return food ? addMacros(acc, scaleMacros(food, item.grams)) : acc;
  }, { ...ZERO_MACROS });
}

function fmtMacro(n, whole) {
  if (!Number.isFinite(n)) return "0";
  const v = whole ? Math.round(n) : Math.round(n * 10) / 10;
  return Number.isInteger(v) ? String(v) : v.toFixed(1);
}

function avg(arr) {
  return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
}

function fmtAvg(n, digits = 1) {
  if (n == null) return "—";
  const f = 10 ** digits;
  const r = Math.round(n * f) / f;
  return Number.isInteger(r) ? String(r) : r.toFixed(digits);
}

function weekRangeLabel(monday) {
  const start = parseDate(monday);
  const end = parseDate(addDays(monday, 6));
  if (start.getMonth() === end.getMonth()) return `${start.getDate()}–${end.getDate()} ${MONTHS[end.getMonth()]}`;
  return `${start.getDate()} ${MONTHS[start.getMonth()]} – ${end.getDate()} ${MONTHS[end.getMonth()]}`;
}

function checkInWeeks(weights, checkIns, todayStr) {
  const end = mondayOf(todayStr);
  let start = addDays(end, -49);
  for (const key of [...Object.keys(weights), ...Object.keys(checkIns)]) {
    if (!weights[key]?.trim() && !checkIns[key]) continue;
    const d = mondayOf(key);
    if (d < start) start = d;
  }
  const weeks = [];
  for (let d = end; d >= start; d = addDays(d, -7)) weeks.push(d);
  return weeks;
}

function volumeRows(plans) {
  const map = new Map();
  for (const m of MUSCLES) map.set(m.id, []);
  const unassigned = [];
  for (const day of DAYS) {
    if (day.rest) continue;
    const exercises = plans[day.id] ?? day.exercises;
    for (const ex of exercises) {
      const muscles = exerciseMuscles(ex);
      const src = { dayId: day.id, day: day.short, exerciseId: ex.id, name: ex.name, sets: ex.sets };
      if (!muscles.length) unassigned.push(src);
      else for (const m of muscles) map.get(m)?.push(src);
    }
  }
  return {
    rows: MUSCLES.map((m) => {
      const sources = map.get(m.id) ?? [];
      return { id: m.id, name: m.name, sets: sources.reduce((n, s) => n + s.sets, 0), sources };
    }),
    unassigned
  };
}

function defaultStore() {
  return {
    unit: "kg",
    startDate: today(),
    sessions: [],
    plans: {},
    library: {},
    weights: {},
    customFoods: [],
    meals: defaultMeals(),
    checkIns: {},
    updatedAt: 0
  };
}

function isStoreEmpty(st) {
  if (!st || typeof st !== "object") return true;
  if (typeof st.updatedAt === "number" && st.updatedAt > 0) return false;
  if (st.unit && st.unit !== "kg") return false;
  if (Array.isArray(st.sessions) && st.sessions.length) return false;
  if (st.plans && typeof st.plans === "object" && Object.keys(st.plans).length) return false;
  if (st.library && typeof st.library === "object" && Object.keys(st.library).length) return false;
  if (st.weights && typeof st.weights === "object" && Object.keys(st.weights).length) return false;
  if (Array.isArray(st.customFoods) && st.customFoods.length) return false;
  if (st.checkIns && typeof st.checkIns === "object" && Object.keys(st.checkIns).length) return false;
  if (Array.isArray(st.meals) && st.meals.some((m) => (m.items && m.items.length) || (m.name && !/^Meal \d+$/.test(m.name)))) return false;
  return true;
}

function applyStateFields(target, st) {
  if (!st || typeof st !== "object") return target;
  if (st.unit === "kg" || st.unit === "lb") target.unit = st.unit;
  if (typeof st.startDate === "string" && /^\d{4}-\d{2}-\d{2}$/.test(st.startDate)) target.startDate = st.startDate;
  if (Array.isArray(st.sessions)) target.sessions = st.sessions;
  if (st.plans && typeof st.plans === "object") target.plans = st.plans;
  if (st.library && typeof st.library === "object") target.library = st.library;
  if (st.weights && typeof st.weights === "object") target.weights = st.weights;
  if (Array.isArray(st.customFoods)) target.customFoods = st.customFoods;
  target.meals = normalizeMeals(st.meals);
  if (st.checkIns && typeof st.checkIns === "object") target.checkIns = st.checkIns;
  if (typeof st.updatedAt === "number" && Number.isFinite(st.updatedAt)) target.updatedAt = st.updatedAt;
  return target;
}

function snapshotState() {
  return {
    unit: store.unit,
    startDate: store.startDate,
    sessions: store.sessions,
    plans: store.plans,
    library: store.library,
    weights: store.weights,
    customFoods: store.customFoods,
    meals: store.meals,
    checkIns: store.checkIns,
    updatedAt: store.updatedAt || 0
  };
}

function writeLocal(state) {
  localStorage.setItem(storageKey(), JSON.stringify({ state, version: 0 }));
}

function backupLocalState(reason) {
  if (!clientToken || isStoreEmpty(store)) return;
  try {
    localStorage.setItem(storageKey() + ":backup", JSON.stringify({
      state: snapshotState(),
      version: 0,
      backedUpAt: Date.now(),
      reason: reason || "conflict"
    }));
  } catch (err) {}
}

let syncStatus = clientToken ? "idle" : "";
let syncTimer = null;
let syncInFlight = false;
let syncQueued = false;

function syncTitle() {
  if (syncStatus === "synced") return "Synced with your coach";
  if (syncStatus === "pending") return "Saving to your coach";
  if (syncStatus === "offline") return "Offline — changes stay on this phone";
  if (syncStatus === "error") return "Could not sync — changes stay on this phone";
  return "Connecting";
}

function setSyncStatus(next) {
  if (!clientToken) return;
  if (syncStatus === next) {
    const el = document.querySelector(".sync-dot");
    if (el) { el.dataset.state = next; el.title = syncTitle(); el.setAttribute("aria-label", syncTitle()); }
    return;
  }
  syncStatus = next;
  const el = document.querySelector(".sync-dot");
  if (el) { el.dataset.state = next; el.title = syncTitle(); el.setAttribute("aria-label", syncTitle()); }
}

async function rpc(name, body, opts) {
  const res = await fetch(SB_URL + "/rest/v1/rpc/" + name, {
    method: "POST",
    headers: {
      apikey: SB_ANON,
      Authorization: "Bearer " + SB_ANON,
      "Content-Type": "application/json"
    },
    body: JSON.stringify(body),
    keepalive: !!(opts && opts.keepalive)
  });
  const text = await res.text();
  let data = null;
  if (text) {
    try { data = JSON.parse(text); }
    catch (err) { data = text; }
  }
  if (!res.ok) {
    const msg = (data && (data.message || data.error || data.hint)) || text || ("HTTP " + res.status);
    const err = new Error(typeof msg === "string" ? msg : "request failed");
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

function parseServerState(raw) {
  if (raw == null || raw === "") return null;
  if (Array.isArray(raw)) raw = raw.length ? raw[0] : null;
  if (typeof raw === "string") {
    try { raw = JSON.parse(raw); }
    catch (err) { return null; }
  }
  if (!raw || typeof raw !== "object") return null;
  return raw;
}

function adoptRemote(remote) {
  const next = applyStateFields(defaultStore(), remote);
  store.unit = next.unit;
  store.startDate = next.startDate;
  store.sessions = next.sessions;
  store.plans = next.plans;
  store.library = next.library;
  store.weights = next.weights;
  store.customFoods = next.customFoods;
  store.meals = next.meals;
  store.checkIns = next.checkIns;
  store.updatedAt = next.updatedAt || 0;
  writeLocal(snapshotState());
  if (typeof ensureSession === "function") ensureSession();
}

async function hydrateFromServer() {
  if (!clientToken) return;
  if (typeof navigator !== "undefined" && navigator.onLine === false) {
    setSyncStatus("offline");
    return;
  }
  try {
    const remote = parseServerState(await rpc("client_load", { p_token: clientToken }));
    const localEmpty = isStoreEmpty(store);
    const remoteEmpty = !remote || isStoreEmpty(remote);
    if (remoteEmpty) {
      if (!localEmpty) queueSync(true);
      else setSyncStatus("synced");
      return;
    }
    const remoteAt = Number(remote.updatedAt) || 0;
    const localAt = Number(store.updatedAt) || 0;
    if (localEmpty || remoteAt > localAt) {
      if (!localEmpty && localAt) backupLocalState("server-newer");
      adoptRemote(remote);
      render();
      setSyncStatus("synced");
    } else if (localAt > remoteAt) {
      queueSync(true);
    } else {
      setSyncStatus("synced");
    }
  } catch (err) {
    setSyncStatus((typeof navigator !== "undefined" && navigator.onLine === false) ? "offline" : "error");
  }
}

function queueSync(immediate) {
  if (!clientToken) return;
  syncQueued = true;
  setSyncStatus((typeof navigator !== "undefined" && navigator.onLine === false) ? "offline" : "pending");
  if (syncTimer) { clearTimeout(syncTimer); syncTimer = null; }
  if (immediate) flushSync();
  else syncTimer = setTimeout(flushSync, 2000);
}

async function flushSync() {
  if (!clientToken || !syncQueued || syncInFlight) return;
  if (typeof navigator !== "undefined" && navigator.onLine === false) {
    setSyncStatus("offline");
    return;
  }
  if (syncTimer) { clearTimeout(syncTimer); syncTimer = null; }
  syncInFlight = true;
  const pushingAt = Number(store.updatedAt) || 0;
  const payload = snapshotState();
  syncQueued = false;
  try {
    let remote = null;
    try { remote = parseServerState(await rpc("client_load", { p_token: clientToken })); }
    catch (err) {
      syncQueued = true;
      throw err;
    }
    const remoteAt = remote ? (Number(remote.updatedAt) || 0) : 0;
    if (remote && !isStoreEmpty(remote) && remoteAt > pushingAt) {
      backupLocalState("server-newer-before-save");
      adoptRemote(remote);
      render();
      setSyncStatus("synced");
      return;
    }
    await rpc("client_save", { p_token: clientToken, p_state: payload });
    setSyncStatus("synced");
  } catch (err) {
    syncQueued = true;
    setSyncStatus((typeof navigator !== "undefined" && navigator.onLine === false) ? "offline" : "error");
  } finally {
    syncInFlight = false;
    if (syncQueued && typeof navigator !== "undefined" && navigator.onLine !== false) {
      syncTimer = setTimeout(flushSync, 2000);
    }
  }
}

function onOnline() {
  if (!clientToken) return;
  if (syncQueued) flushSync();
  else hydrateFromServer();
}

function onOffline() { setSyncStatus("offline"); }

function onVis() {
  if (document.visibilityState === "hidden") {
    if (syncQueued) flushSync();
  }
}

function onPageHide() {
  if (!clientToken || !syncQueued || syncInFlight) return;
  const payload = snapshotState();
  const localAt = Number(payload.updatedAt) || 0;
  // Best-effort flush. Skip if we cannot compare with the server from here.
  rpc("client_save", { p_token: clientToken, p_state: payload }, { keepalive: true }).catch(() => {});
  // Keep queued so a later online/visibility pass can still reconcile.
}

function loadStore() {
  const store = defaultStore();
  try {
    const raw = localStorage.getItem(storageKey());
    if (!raw) return store;
    const parsed = JSON.parse(raw);
    const st = parsed?.state ?? parsed;
    if (!st || typeof st !== "object") return store;
    applyStateFields(store, st);
  } catch (err) {}
  return store;
}

function persist() {
  store.updatedAt = Date.now();
  writeLocal(snapshotState());
  queueSync(false);
}

function upsertSession(session) {
  const i = store.sessions.findIndex((s) => s.id === session.id);
  if (i === -1) store.sessions.push(session);
  else store.sessions[i] = session;
}

function shouldPersistSession(session) {
  const dirty = Object.values(session.sets).some((sets) =>
    sets.some((e) => e.done || e.weight.trim() || e.reps.trim())
  );
  return dirty || session.finished || store.sessions.some((s) => s.id === session.id);
}

function saveSession(session) {
  current = { ...session, updatedAt: Date.now() };
  if (shouldPersistSession(current)) {
    upsertSession(current);
    persist();
  }
}

function patchSet(exerciseId, index, patch) {
  if (!current) return;
  const sets = { ...current.sets };
  sets[exerciseId] = (sets[exerciseId] ?? []).map((e, i) => (i === index ? { ...e, ...patch } : e));
  saveSession({ ...current, sets });
}

let store = loadStore();
let ui = {
  tab: "train",
  date: today(),
  dayId: dayByWeekday(weekday(today())).id,
  settings: false,
  logOpen: null,
  liftId: null,
  addName: "",
  addSets: 3,
  addReps: "8–12",
  addMuscles: [],
  mealOpen: null,
  mealQuery: "",
  mealAmount: "",
  newFoodOpen: false,
  newFood: { name: "", kcal: "", protein: "", carbs: "", fat: "" },
  volumeOpen: "quads"
};
let current = null;

function ensureSession() {
  const day = dayById(ui.dayId);
  const exercises = planFor(ui.dayId, store.plans);
  if (day.rest) {
    current = null;
    return;
  }
  const id = sessionId(ui.dayId, ui.date);
  const existing = store.sessions.find((s) => s.id === id);
  if (existing) {
    const sets = {};
    for (const ex of exercises) sets[ex.id] = fitSets(existing.sets[ex.id], ex.sets);
    current = { ...existing, sets };
    return;
  }
  current = newSession(ui.dayId, exercises, ui.date, store.unit);
}

function addExercise() {
  const name = ui.addName.trim();
  if (!name || ui.addMuscles.length === 0) return;
  const sets = Math.min(10, Math.max(1, Math.round(ui.addSets) || 1));
  const reps = ui.addReps.trim() || "8–12";
  const ex = { id: `custom-${crypto.randomUUID()}`, name, sets, reps, muscles: [...ui.addMuscles] };
  const plan = clonePlan(ui.dayId, store.plans);
  plan.push(ex);
  store.plans = { ...store.plans, [ui.dayId]: plan };
  store.library = { ...store.library, [ex.id]: ex };
  if (current) {
    saveSession({ ...current, sets: { ...current.sets, [ex.id]: Array.from({ length: ex.sets }, () => emptySet()) } });
  }
  ui.addName = "";
  persist();
}

function removeExercise(id) {
  const plan = clonePlan(ui.dayId, store.plans).filter((e) => e.id !== id);
  const found = planFor(ui.dayId, store.plans).find((e) => e.id === id);
  store.plans = { ...store.plans, [ui.dayId]: plan };
  if (found) store.library = { ...store.library, [found.id]: found };
  if (current) {
    const sets = { ...current.sets };
    delete sets[id];
    saveSession({ ...current, sets });
  }
  persist();
}

function moveExercise(id, delta) {
  const plan = clonePlan(ui.dayId, store.plans);
  const i = plan.findIndex((e) => e.id === id);
  const j = i + delta;
  if (i < 0 || j < 0 || j >= plan.length) return;
  const [item] = plan.splice(i, 1);
  plan.splice(j, 0, item);
  store.plans = { ...store.plans, [ui.dayId]: plan };
  persist();
  requestAnimationFrame(() => document.getElementById(`exercise-${id}`)?.scrollIntoView({ block: "nearest" }));
}

function updateExercise(id, patch) {
  let updated;
  const plan = clonePlan(ui.dayId, store.plans).map((ex) => {
    if (ex.id !== id) return ex;
    const sets = patch.sets == null ? ex.sets : Math.min(12, Math.max(1, Math.round(patch.sets) || ex.sets));
    const reps = patch.reps == null ? ex.reps : patch.reps;
    let ranges = setRanges(ex);
    if (patch.reps != null && patch.reps !== ex.reps) ranges = ranges.map((r) => (r === ex.reps ? patch.reps : r));
    if (patch.setIndex != null && patch.setRange != null && patch.setIndex >= 0) ranges[patch.setIndex] = patch.setRange;
    if (sets > ranges.length) {
      const fill = ranges[ranges.length - 1] || reps || "8–12";
      ranges = ranges.concat(Array.from({ length: sets - ranges.length }, () => fill));
    } else if (sets < ranges.length) ranges = ranges.slice(0, sets);
    const setReps = ranges.every((r) => r === reps) ? undefined : ranges;
    const muscles = patch.muscles ?? ex.muscles;
    updated = { ...ex, sets, reps, setReps, muscles };
    return updated;
  });
  if (!updated) return;
  store.plans = { ...store.plans, [ui.dayId]: plan };
  store.library = { ...store.library, [updated.id]: updated };
  if (current && patch.sets != null) {
    saveSession({ ...current, sets: { ...current.sets, [id]: fitSets(current.sets[id], updated.sets) } });
  }
  persist();
}

function copyLast() {
  const prev = previousSession(store.sessions, ui.dayId, ui.date);
  if (!current || !prev) return;
  const exercises = planFor(ui.dayId, store.plans);
  const sets = {};
  for (const ex of exercises) {
    const prevSets = prev.sets[ex.id] ?? [];
    sets[ex.id] = (current.sets[ex.id] ?? []).map((row, i) => {
      if (row.weight.trim() || row.reps.trim()) return row;
      const p = prevSets[i];
      return p ? { ...row, weight: p.weight, reps: p.reps } : row;
    });
  }
  saveSession({ ...current, sets });
}

function exportCsv() {
  const lines = [["Date", "Session", "Exercise", "Set", "Weight", "Unit", "Reps", "Done", "Target"].join(",")];
  const sessions = store.sessions.filter(isLogged).slice().sort((a, b) => (a.date < b.date ? -1 : 1));
  for (const session of sessions) {
    const day = DAYS.find((d) => d.id === session.dayId);
    if (!day) continue;
    const ids = planFor(session.dayId, store.plans).map((e) => e.id);
    const all = [...ids, ...Object.keys(session.sets).filter((id) => !ids.includes(id))];
    for (const id of all) {
      const entries = session.sets[id] ?? [];
      const ex = findExercise(id, store.plans, store.library);
      entries.forEach((row, i) => {
        if (!(row.weight.trim() || row.reps.trim() || row.done)) return;
        const target = ex ? (setRanges(ex)[i] || ex.reps) : "";
        lines.push([session.date, day.name, ex?.name ?? "Exercise", i + 1, row.weight, session.unit, row.reps, row.done ? "yes" : "no", target].map(csvEscape).join(","));
      });
    }
  }
  const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "block-log.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function renderExercise(ex, index, total, entries, previous, previousUnit, step, unit) {
  const ranges = setRanges(ex);
  const lastBits = (previous ?? []).map((e) => (!e.weight.trim() && !e.reps.trim() ? null : `${e.weight || "—"}×${e.reps || "—"}`)).filter(Boolean);
  const lastLine = lastBits.length ? `<p class="last-time">Last time ${esc(lastBits.join("  ·  "))}${previousUnit ? ` ${esc(previousUnit)}` : ""}</p>` : "";
  const rows = entries.map((row, i) => {
    const prev = previous?.[i];
    const last = prev && (prev.weight.trim() || prev.reps.trim()) ? `Last ${prev.weight || "—"}-${previousUnit ? ` ${previousUnit}` : ""} × ${prev.reps || "—"}`.replace("- ", "") : null;
    const lastPretty = prev && (prev.weight.trim() || prev.reps.trim()) ? `Last ${prev.weight || "—"}${previousUnit ? ` ${previousUnit}` : ""} × ${prev.reps || "—"}` : null;
    const target = ranges[i] ?? ex.reps;
    return `<div class="set">
      <div class="set-target">
        <span class="set-n">${i + 1}</span>
        <label class="target-wrap"><span class="lbl">Target</span><input value="${esc(target)}" aria-label="Set ${i + 1} target reps" data-keep="target" data-ex="${esc(ex.id)}" data-i="${i}"></label>
      </div>
      <div class="set-row">
        <span class="set-n"></span>
        <button type="button" class="icon-btn solid" aria-label="Decrease set ${i + 1} weight" data-act="weight" data-ex="${esc(ex.id)}" data-i="${i}" data-delta="${-step}">${ICONS.minus}</button>
        <label class="weight-lab"><span class="sr-only">Set ${i + 1} weight in ${esc(unit)}</span><input class="weight-input" inputmode="decimal" value="${esc(row.weight)}" placeholder="0" aria-label="Set ${i + 1} weight" data-keep="weight" data-ex="${esc(ex.id)}" data-i="${i}"></label>
        <button type="button" class="icon-btn solid" aria-label="Increase set ${i + 1} weight" data-act="weight" data-ex="${esc(ex.id)}" data-i="${i}" data-delta="${step}">${ICONS.plus}</button>
        <label class="reps-lab"><span class="sr-only">Set ${i + 1} reps</span><input class="reps-input" inputmode="numeric" value="${esc(row.reps)}" placeholder="–" aria-label="Set ${i + 1} reps" data-keep="reps" data-ex="${esc(ex.id)}" data-i="${i}"></label>
        <button type="button" class="done-btn${row.done ? " on" : ""}" aria-label="${row.done ? "Undo set" : "Complete set"} ${i + 1}" aria-pressed="${row.done}" data-act="toggle-done" data-ex="${esc(ex.id)}" data-i="${i}">${ICONS.check}</button>
        ${lastPretty ? `<span class="sr-only">${esc(lastPretty)}</span>` : ""}
      </div>
    </div>`;
  }).join("");

  return `<section class="card ex" id="exercise-${esc(ex.id)}">
    <div class="ex-top">
      <h3 class="ex-name"><span class="ex-idx">${index}</span>${esc(ex.name)}</h3>
      <div class="ex-actions">
        <button type="button" class="icon-btn solid" aria-label="Move ${esc(ex.name)} up" ${index === 1 ? "disabled" : ""} data-act="move" data-ex="${esc(ex.id)}" data-delta="-1">${ICONS.chevronUp}</button>
        <button type="button" class="icon-btn solid" aria-label="Move ${esc(ex.name)} down" ${index === total ? "disabled" : ""} data-act="move" data-ex="${esc(ex.id)}" data-delta="1">${ICONS.chevronDown}</button>
        <button type="button" class="icon-btn solid" aria-label="Remove ${esc(ex.name)}" data-act="remove" data-ex="${esc(ex.id)}">${ICONS.trash}</button>
      </div>
    </div>
    ${ex.cue ? `<p class="cue">${esc(ex.cue)}</p>` : ""}
    <div class="set-ctrl">
      <button type="button" class="icon-btn solid" aria-label="Remove a set from ${esc(ex.name)}" ${ex.sets <= 1 ? "disabled" : ""} data-act="adj-sets" data-ex="${esc(ex.id)}" data-delta="-1">${ICONS.minus}</button>
      <span class="set-count">${ex.sets} sets</span>
      <button type="button" class="icon-btn solid" aria-label="Add a set to ${esc(ex.name)}" ${ex.sets >= 12 ? "disabled" : ""} data-act="adj-sets" data-ex="${esc(ex.id)}" data-delta="1">${ICONS.plus}</button>

}

        <span class="lift-right">
          <span class="num" style="display:block;font-family:var(--font-display);font-size:1.25rem;line-height:1;color:var(--fg);font-variant-numeric:tabular-nums">${last ? last.weight : "—"}</span>
          <span class="lift-sub">${last ? `${esc(last.unit)} × ${esc(last.reps)}` : "no sets"}${delta != null && delta !== 0 ? `  ${delta > 0 ? "+" : ""}${delta}` : ""}</span>
        </span>
      </button>`;
    }).join("");
    return `<section><h3 class="lift-group-title" style="margin:0 0 .5rem;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)">${esc(dayById(dayId).short)}</h3><div class="lift-list">${rows}</div></section>`;
  }).join("");
  return `<div class="page-stack"><h2 class="page-title">Lifts</h2>${sections}</div>`;
}

function renderLiftDetail(ex, dayName, points) {
  const sameUnit = points.every((p) => p.unit === points[0]?.unit);
  let chart;
  if (points.length >= 2 && sameUnit) {
    const xs = points.map((_, i) => i);
    const ys = points.map((p) => p.weight);
    const min = Math.min(...ys) - 5, max = Math.max(...ys) + 5;
    const w = 300, h = 140, pad = 12;
    const coords = points.map((p, i) => {
      const x = pad + (i / (points.length - 1)) * (w - pad * 2);
      const y = pad + (1 - (p.weight - min) / (max - min || 1)) * (h - pad * 2);
      return `${x},${y}`;
    });
    const dots = points.map((p, i) => {
      const x = pad + (i / (points.length - 1)) * (w - pad * 2);
      const y = pad + (1 - (p.weight - min) / (max - min || 1)) * (h - pad * 2);
      return `<circle cx="${x}" cy="${y}" r="3" fill="currentColor"/>`;
    }).join("");
    chart = `<div class="chart card"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill="none" stroke="currentColor" stroke-width="2" points="${coords.join(" ")}"/>${dots}</svg></div>`;
  } else {
    chart = `<p class="banner">${points.length === 0 ? "Log this lift twice and the line shows up." : "One session so far. Log it again to see the line."}</p>`;
  }
  const hist = points.length ? `<ul class="history-list">${[...points].reverse().map((p) =>
    `<li><span class="when">${esc(p.label)}</span><span class="val">${esc(p.weight)}<span>${esc(p.unit)} × ${esc(p.reps)}</span></span></li>`
  ).join("")}</ul>` : "";
  return `<div class="lift-pages">
    <button type="button" class="back-pill" data-act="lifts-back">All lifts</button>
    <div><p class="lede" style="margin:0">${esc(dayName)}</p><h2 class="page-title">${esc(ex.name)}</h2></div>
    ${chart}${hist}
  </div>`;
}

function renderVolume() {
  const { rows, unassigned } = volumeRows(store.plans);
  const max = Math.max(1, ...rows.map((r) => r.sets));
  const list = rows.map((row) => {
    const open = ui.volumeOpen === row.id;
    const sources = open ? `<ul class="vol-sources">${row.sources.length === 0
      ? `<li class="lede" style="margin:0">No work yet.</li>`
      : row.sources.map((s) => `<li><p class="src-name"><span class="src-day">${esc(s.day)}</span> ${esc(s.name)}</p><p class="tabular" style="margin:0;color:var(--muted);flex-shrink:0">${s.sets}</p></li>`).join("")
    }</ul>` : "";
    return `<li class="card vol-card">
      <button type="button" class="log-row" aria-expanded="${open}" data-act="toggle-vol" data-id="${esc(row.id)}">
        <div class="log-main"><div class="vol-top"><p class="vol-name">${esc(row.name)}</p><p class="vol-sets">${row.sets}</p></div>
        <div class="bar"><span style="width:${Math.round(row.sets / max * 100)}%"></span></div></div>
      </button>${sources}
    </li>`;
  }).join("");
  const leftover = unassigned.length ? `<section class="card ex"><h3 style="margin:0;font-size:1rem;font-weight:500">Not counted yet</h3><p class="lede">Pick a muscle so these sets land in the totals.</p><ul style="margin:.75rem 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:1rem">${unassigned.map((n) =>
    `<li><p style="margin:0;font-size:.875rem">${esc(n.day)} · ${esc(n.name)}<span style="color:var(--muted)"> · ${n.sets} sets</span></p><div class="muscle-row">${MUSCLES.map((m) => {
      const has = (findExercise(n.exerciseId, store.plans, store.library)?.muscles ?? []).includes(m.id);
      return `<button type="button" class="pill${has ? " on" : ""}" data-act="assign-muscle" data-day="${esc(n.dayId)}" data-ex="${esc(n.exerciseId)}" data-muscle="${esc(m.id)}">${esc(m.name)}</button>`;
    }).join("")}</div></li>`
  ).join("")}</ul></section>` : "";
  return `<div class="stack"><div><h2 class="page-title">Weekly sets</h2><p class="lede">Counts the plan, not what you logged. Adding a set or an exercise updates this. A set counts for every muscle that exercise trains.</p></div><ul class="stack-3" style="list-style:none;margin:0;padding:0">${list}</ul>${leftover}</div>`;
}

function renderCheckIn() {
  const todayStr = today();
  const weeks = checkInWeeks(store.weights, store.checkIns, todayStr);
  const sections = weeks.map((monday) => {
    const days = DOW_MON.map((_, i) => addDays(monday, i));
    const wAvg = avg(days.map((d) => parseNum(store.weights[d] ?? "")).filter((n) => n != null && n > 0));
    const sAvg = avg(days.map((d) => parseNum(store.checkIns[d]?.steps ?? "")).filter((n) => n != null && n > 0));
    const slAvg = avg(days.map((d) => parseNum(store.checkIns[d]?.sleep ?? "")).filter((n) => n != null && n > 0));
    const rAvg = avg(days.map((d) => parseNum(store.checkIns[d]?.recovery ?? "")).filter((n) => n != null && n > 0));
    const rows = DOW_MON.map((label, i) => {
      const date = days[i];
      const future = date > todayStr;
      const ci = store.checkIns[date] ?? { steps: "", sleep: "", recovery: "" };
      return `<div class="check-day">
        <div class="check-head"><p class="dow">${esc(label)}</p><p class="dt${date === todayStr ? " today" : ""}">${esc(fmtEEE(date).split(" ").slice(1).join(" "))}</p></div>
        <div class="check-grid">
          ${field("Weight, " + store.unit, `${label} ${date} weight`, store.weights[date] ?? "", future, `weight:${date}`)}
          ${field("Steps", `${label} ${date} steps`, ci.steps, future, `steps:${date}`)}
          ${field("Sleep, hours", `${label} ${date} sleep`, ci.sleep, future, `sleep:${date}`)}
          ${field("Recovery, 1–10", `${label} ${date} recovery`, ci.recovery, future, `recovery:${date}`)}
        </div>
      </div>`;
    }).join("");
    return `<section class="card check-sec">
      <h3>${esc(weekRangeLabel(monday))}</h3>
      <div>${rows}</div>
      <div class="avg-grid">
        <div><p class="avg-label">Weight</p><p class="avg-val">${esc(fmtAvg(wAvg))}${store.unit ? `<span>${esc(store.unit)}</span>` : ""}</p></div>
        <div><p class="avg-label">Steps</p><p class="avg-val">${esc(fmtAvg(sAvg, 0))}</p></div>
        <div><p class="avg-label">Sleep</p><p class="avg-val">${esc(fmtAvg(slAvg))}<span>h</span></p></div>
        <div><p class="avg-label">Recovery</p><p class="avg-val">${esc(fmtAvg(rAvg))}</p></div>
      </div>
    </section>`;
  }).join("");
  return `<div class="stack"><div><h2 class="page-title">Check-in</h2><p class="lede">Every day. Weight, steps, sleep, and recovery from 1 to 10. Sunday shows the week average.</p></div>${sections}</div>`;
}

function field(label, aria, value, disabled, keep) {
  return `<label class="flabel">${esc(label)}<input inputmode="decimal" aria-label="${esc(aria)}" value="${esc(value)}" ${disabled ? "disabled" : ""} placeholder="—" data-keep="${esc(keep)}"></label>`;
}

function renderMeals() {
  const meals = normalizeMeals(store.meals);
  store.meals = meals;
  const foods = [...FOODS, ...store.customFoods];
  const dayTotal = meals.reduce((acc, meal) => addMacros(acc, mealMacros(meal, store.customFoods)), { ...ZERO_MACROS });
  const cards = meals.map((meal, idx) => {
    const macros = mealMacros(meal, store.customFoods);
    const open = ui.mealOpen === meal.id;
    const q = ui.mealQuery.trim().toLowerCase();
    const matches = q
      ? foods.filter((f) => f.name.toLowerCase().includes(q)).sort((a, b) => +!a.name.toLowerCase().startsWith(q) - +!b.name.toLowerCase().startsWith(q) || a.name.localeCompare(b.name)).slice(0, 8)
      : [];
    const items = meal.items.map((item) => {
      const food = foodById(item.foodId, store.customFoods);
      return `<div class="meal-item">
        <div class="meal-item-top"><p>${esc(food?.name ?? "Removed food")}</p><button type="button" class="rm" data-act="rm-item" data-meal="${esc(meal.id)}" data-item="${esc(item.id)}">Remove</button></div>
        <div class="grams-row"><input inputmode="decimal" aria-label="Grams of ${esc(food?.name ?? "food")}" value="${esc(String(item.grams))}" data-keep="grams" data-meal="${esc(meal.id)}" data-item="${esc(item.id)}"><span>${esc(food?.unit || "g")}</span></div>
      </div>`;
    }).join("");
    const search = open ? `<div class="mt-4" style="border-top:1px solid var(--line);padding-top:.75rem;position:relative">
      <div class="search-row">
        <input class="field q" value="${esc(ui.mealQuery)}" placeholder="Type a food" aria-label="Search foods for ${esc(meal.name)}" data-keep="mealQuery">
        <input class="field" style="width:6rem;flex:0 0 6rem;text-align:center" inputmode="decimal" aria-label="Amount to add" placeholder="Amount" value="${esc(ui.mealAmount)}" data-keep="mealAmount">
      </div>
      ${q ? `<ul class="suggest">${matches.length ? matches.map((f) =>
        `<li><button type="button" data-act="add-item" data-meal="${esc(meal.id)}" data-food="${esc(f.id)}"><span>${esc(f.name)}</span><span class="amt">${esc(fmtMacro(f.portion))} ${esc(f.unit)}</span></button></li>`
      ).join("") : `<li class="none">No match.</li>`}</ul>` : ""}
      <button type="button" class="linkish" data-act="toggle-new-food">${ui.newFoodOpen ? "Close" : "New food"}</button>
      ${ui.newFoodOpen ? `<div class="new-food">
        <input class="field span2" value="${esc(ui.newFood.name)}" placeholder="Name" aria-label="New food name" data-keep="nf-name">
        ${nf("Kcal / 100g", ui.newFood.kcal, "nf-kcal")}${nf("Protein", ui.newFood.protein, "nf-protein")}${nf("Carbs", ui.newFood.carbs, "nf-carbs")}${nf("Fat", ui.newFood.fat, "nf-fat")}
        <button type="button" class="btn-primary span2" data-act="create-food" data-meal="${esc(meal.id)}">Add to meal</button>
      </div>` : ""}
    </div>` : `<button type="button" class="btn-line mt-4" data-act="open-meal" data-id="${esc(meal.id)}">Add food</button>`;
    return `<section class="card meal${open ? " z" : ""}">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:.75rem"><p class="meal-num">${idx + 1}</p></div>
      <input class="meal-name" value="${esc(meal.name)}" aria-label="Name for meal ${idx + 1}" data-keep="meal-name" data-meal="${esc(meal.id)}">
      ${items}
      <div class="meal-total"><p class="kicker" style="letter-spacing:.18em">Meal total</p><div class="mt-2">${macrosBlock(macros)}</div></div>
      ${search}
    </section>`;
  }).join("");
  return `<div class="page-stack-lg">
    <div><h2 class="page-title">Meals</h2><p class="lede">Six meals. Each one shows its own macros. The figures above are the full day.</p></div>
    <section class="day-total">
      <p class="kicker">Day total</p>
      <p class="kcal">${esc(fmtMacro(dayTotal.kcal, true))}<span>kcal</span></p>
      <div class="macro-grid">${macroCell("Protein", dayTotal.protein)}${macroCell("Carbs", dayTotal.carbs)}${macroCell("Fat", dayTotal.fat)}</div>
    </section>
    ${cards}
  </div>`;
}

function nf(label, value, keep) {
  return `<label class="flabel">${esc(label)}<input inputmode="decimal" value="${esc(value)}" data-keep="${esc(keep)}"></label>`;
}

function renderSettings() {
  if (!ui.settings) return "";
  return `<div class="sheet-bg">
    <button type="button" class="sheet-dismiss" aria-label="Close settings" data-act="close-settings"></button>
    <div class="sheet">
      <h2>Settings</h2>
      <p class="hint">Units for new sessions</p>
      <div class="unit-grid">${["kg", "lb"].map((u) =>
        `<button type="button" class="${store.unit === u ? "btn-primary" : "btn-line"}" data-act="unit" data-unit="${u}">${u}</button>`
      ).join("")}</div>
      <label>Block started<input class="field mt-2" type="date" value="${esc(store.startDate)}" data-keep="startDate"></label>
      <button type="button" class="btn-line mt-3" data-act="start-today">Start next block today</button>
      <button type="button" class="btn-primary mt-3" data-act="export">Export for Google Sheets</button>
      <p class="lede">Downloads a CSV. In Google Sheets use File, Import, then Upload.</p>
      <button type="button" class="clear" data-act="clear-log">Clear log</button>
      ${clientToken ? `<p class="lede privacy-note">Your sessions, lifts, weights, check-ins and meals are stored on this phone and copied to your coach, who can see them. To delete your data, ask your coach.</p>` : ""}
    </div>
  </div>`;
}

function render() {
  const root = document.getElementById("app");
  const focused = document.activeElement;
  const keepId = focused && focused.dataset && focused.dataset.keep ? keepFocusKey(focused) : null;
  const selStart = focused && focused.selectionStart;
  const selEnd = focused && focused.selectionEnd;

  let main = "";
  if (ui.tab === "train") main = renderTrain();
  else if (ui.tab === "log") main = renderLog();
  else if (ui.tab === "lifts") main = renderLifts();
  else if (ui.tab === "volume") main = renderVolume();
  else if (ui.tab === "weight") main = renderCheckIn();
  else if (ui.tab === "meals") main = renderMeals();

  root.innerHTML = `<div class="app">${renderHeader()}<main>${main}</main>${renderTabs()}${renderSettings()}</div>`;

  if (keepId) {
    const el = findKeep(keepId);
    if (el) {
      el.focus();
      if (typeof selStart === "number" && el.setSelectionRange) {
        try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }
}

function keepFocusKey(el) {
  return [el.dataset.keep, el.dataset.ex, el.dataset.i, el.dataset.meal, el.dataset.item].filter(Boolean).join("|");
}

function findKeep(key) {
  return [...document.querySelectorAll("[data-keep]")].find((el) => keepFocusKey(el) === key);
}

function onClick(e) {
  const tab = e.target.closest("[data-tab]");
  if (tab) {
    ui.tab = tab.dataset.tab;
    ui.liftId = null;
    render();
    return;
  }
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;
  if (act === "settings") ui.settings = true;
  else if (act === "close-settings") ui.settings = false;
  else if (act === "unit") { store.unit = btn.dataset.unit; persist(); }
  else if (act === "start-today") { store.startDate = today(); persist(); }
  else if (act === "export") { exportCsv(); ui.settings = false; }
  else if (act === "clear-log") {
    if (window.confirm("Clear every logged session on this phone?")) {
      store.sessions = [];
      store.startDate = today();
      persist();
      ui.settings = false;
      ensureSession();
    }
  }
  else if (act === "prev-day") { ui.date = addDays(ui.date, -1); ui.dayId = dayByWeekday(weekday(ui.date)).id; }
  else if (act === "next-day") { ui.date = addDays(ui.date, 1); ui.dayId = dayByWeekday(weekday(ui.date)).id; }
  else if (act === "chip") ui.dayId = btn.dataset.id;
  else if (act === "copy-last") copyLast();
  else if (act === "finish") { if (current) saveSession({ ...current, finished: true }); }
  else if (act === "toggle-done") {
    if (!current) return;
    const row = current.sets[btn.dataset.ex]?.[Number(btn.dataset.i)];
    if (row) patchSet(btn.dataset.ex, Number(btn.dataset.i), { done: !row.done });
  }
  else if (act === "weight") patchSet(btn.dataset.ex, Number(btn.dataset.i), { weight: adjustWeight(current?.sets[btn.dataset.ex]?.[Number(btn.dataset.i)]?.weight ?? "", Number(btn.dataset.delta)) });
  else if (act === "move") moveExercise(btn.dataset.ex, Number(btn.dataset.delta));
  else if (act === "remove") removeExercise(btn.dataset.ex);
  else if (act === "adj-sets") {
    const ex = planFor(ui.dayId, store.plans).find((x) => x.id === btn.dataset.ex);
    if (ex) updateExercise(ex.id, { sets: ex.sets + Number(btn.dataset.delta) });
  }
  else if (act === "add-sets") ui.addSets = Math.min(10, Math.max(1, ui.addSets + Number(btn.dataset.delta)));
  else if (act === "toggle-muscle") {
    ui.addMuscles = ui.addMuscles.includes(btn.dataset.id)
      ? ui.addMuscles.filter((id) => id !== btn.dataset.id)
      : [...ui.addMuscles, btn.dataset.id];
  }
  else if (act === "toggle-log") ui.logOpen = ui.logOpen === btn.dataset.id ? null : btn.dataset.id;
  else if (act === "open-lift") ui.liftId = btn.dataset.id;
  else if (act === "lifts-back") ui.liftId = null;
  else if (act === "toggle-vol") ui.volumeOpen = ui.volumeOpen === btn.dataset.id ? null : btn.dataset.id;
  else if (act === "assign-muscle") {
    const ex = planFor(btn.dataset.day, store.plans).find((x) => x.id === btn.dataset.ex);
    const currentMuscles = ex?.muscles ?? [];
    const muscles = currentMuscles.includes(btn.dataset.muscle)
      ? currentMuscles.filter((id) => id !== btn.dataset.muscle)
      : [...currentMuscles, btn.dataset.muscle];
    const dayIdWas = ui.dayId;
    ui.dayId = btn.dataset.day;
    updateExercise(btn.dataset.ex, { muscles });
    ui.dayId = dayIdWas;
  }
  else if (act === "open-meal") { ui.mealOpen = btn.dataset.id; ui.mealQuery = ""; ui.mealAmount = ""; ui.newFoodOpen = false; }
  else if (act === "toggle-new-food") ui.newFoodOpen = !ui.newFoodOpen;
  else if (act === "add-item") {
    const food = foodById(btn.dataset.food, store.customFoods);
    const n = Number(ui.mealAmount);
    const grams = Number.isFinite(n) && n > 0 ? n : food?.portion || 100;
    store.meals = normalizeMeals(store.meals).map((m) => m.id === btn.dataset.meal ? { ...m, items: [...m.items, { id: crypto.randomUUID(), foodId: btn.dataset.food, grams }] } : m);
    ui.mealQuery = "";
    ui.mealAmount = "";
    ui.newFoodOpen = false;
    persist();
  }
  else if (act === "create-food") {
    const t = ui.newFood.name.trim();
    const kcal = Number(ui.newFood.kcal), protein = Number(ui.newFood.protein), carbs = Number(ui.newFood.carbs), fat = Number(ui.newFood.fat);
    if (!t || ![kcal, protein, carbs, fat].every((n) => Number.isFinite(n) && n >= 0)) return;
    const food = { id: `food-${crypto.randomUUID()}`, name: t, portion: 100, unit: "g", kcal, protein, carbs, fat };
    store.customFoods = [...store.customFoods, food];
    const n = Number(ui.mealAmount);
    store.meals = normalizeMeals(store.meals).map((m) => m.id === btn.dataset.meal ? { ...m, items: [...m.items, { id: crypto.randomUUID(), foodId: food.id, grams: Number.isFinite(n) && n > 0 ? n : 100 }] } : m);
    ui.mealQuery = "";
    ui.mealAmount = "";
    ui.newFoodOpen = false;
    ui.newFood = { name: "", kcal: "", protein: "", carbs: "", fat: "" };
    persist();
  }
  else if (act === "rm-item") {
    store.meals = normalizeMeals(store.meals).map((m) => m.id === btn.dataset.meal ? { ...m, items: m.items.filter((i) => i.id !== btn.dataset.item) } : m);
    persist();
  }
  render();
}

function onSubmit(e) {
  const form = e.target.closest("[data-act=add-ex]");
  if (!form) return;
  e.preventDefault();
  addExercise();
  render();
}

function onInput(e) {
  const el = e.target;
  const keep = el.dataset.keep;
  if (!keep) return;
  const val = el.value;
  if (keep === "addName") ui.addName = val;
  else if (keep === "addReps") ui.addReps = val;
  else if (keep === "ex-reps") updateExercise(el.dataset.ex, { reps: val });
  else if (keep === "target") updateExercise(el.dataset.ex, { setIndex: Number(el.dataset.i), setRange: val });
  else if (keep === "weight") patchSet(el.dataset.ex, Number(el.dataset.i), { weight: val });
  else if (keep === "reps") patchSet(el.dataset.ex, Number(el.dataset.i), { reps: val });
  else if (keep === "startDate") { store.startDate = val; persist(); }
  else if (keep.startsWith("weight:")) {
    const date = keep.slice(7);
    if (val.trim()) store.weights[date] = val; else delete store.weights[date];
    persist();
  } else if (keep.startsWith("steps:") || keep.startsWith("sleep:") || keep.startsWith("recovery:")) {
    const [field, date] = keep.split(":");
    const cur = store.checkIns[date] ?? { steps: "", sleep: "", recovery: "" };
    const next = { ...cur, [field]: val };
    if (!next.steps.trim() && !next.sleep.trim() && !next.recovery.trim()) delete store.checkIns[date];
    else store.checkIns[date] = next;
    persist();
  } else if (keep === "meal-name") {
    store.meals = normalizeMeals(store.meals).map((m) => m.id === el.dataset.meal ? { ...m, name: val } : m);
    persist();
  } else if (keep === "grams") {
    const n = Number(val);
    store.meals = normalizeMeals(store.meals).map((m) => m.id === el.dataset.meal ? { ...m, items: m.items.map((i) => i.id === el.dataset.item ? { ...i, grams: Number.isFinite(n) && n >= 0 ? n : 0 } : i) } : m);
    persist();
  } else if (keep === "mealQuery") { ui.mealQuery = val; render(); return; }
  else if (keep === "mealAmount") ui.mealAmount = val;
  else if (keep === "nf-name") ui.newFood.name = val;
  else if (keep === "nf-kcal") ui.newFood.kcal = val;
  else if (keep === "nf-protein") ui.newFood.protein = val;
  else if (keep === "nf-carbs") ui.newFood.carbs = val;
  else if (keep === "nf-fat") ui.newFood.fat = val;

  if (keep === "addName" || keep === "addReps") {
    const btn = document.querySelector("[data-act=add-ex] .btn-primary");
    if (btn) btn.disabled = !ui.addName.trim() || ui.addMuscles.length === 0;
  }
  if (ui.tab === "train") {
    const p = document.querySelector(".progress");
    if (p && current) {
      const exercises = planFor(ui.dayId, store.plans);
      p.textContent = `${doneCount(current)}/${exercises.reduce((n, e) => n + e.sets, 0)}`;
    }
  }
}

function onBlur(e) {
  const el = e.target;
  if (el.dataset.keep === "ex-reps") {
    const next = el.value.trim() || "8–12";
    const ex = planFor(ui.dayId, store.plans).find((x) => x.id === el.dataset.ex);
    if (ex && next !== ex.reps) updateExercise(ex.id, { reps: next });
    else if (!el.value.trim()) { el.value = next; updateExercise(el.dataset.ex, { reps: next }); }
    render();
  } else if (el.dataset.keep === "target") {
    if (!el.value.trim()) {
      const ex = planFor(ui.dayId, store.plans).find((x) => x.id === el.dataset.ex);
      updateExercise(el.dataset.ex, { setIndex: Number(el.dataset.i), setRange: ex?.reps || "8–12" });
      render();
    }
  }
}

document.addEventListener("click", onClick);
document.addEventListener("submit", onSubmit);
document.addEventListener("input", onInput);
document.addEventListener("blur", onBlur, true);
render();
if (clientToken) {
  window.addEventListener("online", onOnline);
  window.addEventListener("offline", onOffline);
  document.addEventListener("visibilitychange", onVis);
  window.addEventListener("pagehide", onPageHide);
  hydrateFromServer();
}

</script>
</body>
</html>

  --bg-2: #121410;

  --fg: #f4f1e8;

  --primary: #c8f54a;
  --primary-fg: #12140c;
  --accent: #c8f54a;
  --line: #2c2f28;
  --danger: #c4b8a8;

  --radius: 1.15rem;
  --radius-sm: 0.85rem;
  --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Times New Roman", Georgia, serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { height: 100%; background: var(--bg); }
body {
  min-height: 100%;
  color: var(--fg);
  font-family: var(--font-sans);

    radial-gradient(1200px 700px at 80% -10%, rgba(200, 245, 74, 0.08), transparent 55%),
    radial-gradient(900px 500px at 0% 100%, rgba(200, 245, 74, 0.04), transparent 50%),
    linear-gradient(180deg, #10120e 0%, var(--bg) 28%, var(--bg) 100%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
input { border: 0; }
:focus { outline: none; }
:focus-visible { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--primary); }
.app { width: 100%; max-width: 32rem; margin: 0 auto; min-height: 100dvh; position: relative; }
.header {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: flex-end; justify-content: space-between;
  padding: calc(1.15rem + var(--safe-top)) 1.25rem 1rem;

    linear-gradient(180deg, rgba(200, 245, 74, 0.07), rgba(255, 255, 255, 0.04) 36%, transparent 70%),

  backdrop-filter: blur(22px) saturate(1.4);
  -webkit-backdrop-filter: blur(22px) saturate(1.4);

  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
}
.brand-kicker { margin: 0; font-size: 11px; letter-spacing: 0.46em; text-transform: uppercase; color: var(--fg); font-weight: 600; }
.brand-rule { margin-top: 0.75rem; width: 2.5rem; height: 2px; background: var(--accent); border-radius: 99px; box-shadow: 0 0 16px rgba(200, 245, 74, 0.45); }
.brand-sub { margin: 0.75rem 0 0; font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--muted); }
.icon-btn, .text-btn {
  min-height: 2.75rem; display: inline-flex; align-items: center; justify-content: center;

}
.icon-btn { width: 2.75rem; padding: 0; }
.icon-btn:hover, .text-btn:hover { background: var(--raised); }
main { padding: 1rem 1.25rem calc(2.5rem + var(--safe-bottom)); }
.page-title { margin: 0; font-family: var(--font-display); font-size: 2.35rem; line-height: 0.95; letter-spacing: -0.03em; }
.lede { margin: 0.5rem 0 0; font-size: 0.875rem; line-height: 1.625; color: var(--muted); }
.kicker { margin: 0; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
.card {

}
.stack { display: flex; flex-direction: column; gap: 0.75rem; }
.stack-lg { display: flex; flex-direction: column; gap: 1.25rem; }
.field, .pass {

}
.pass { letter-spacing: 0.12em; }
.btn-primary, .btn-line, .btn-danger {

.btn-primary { background: var(--primary); color: var(--primary-fg); }
.btn-line { box-shadow: inset 0 0 0 1px var(--line); color: var(--fg); background: transparent; }
.btn-danger { box-shadow: inset 0 0 0 1px var(--line); color: var(--danger); background: transparent; }
.btn-primary:disabled, .btn-line:disabled { opacity: 0.45; cursor: default; }
.err {

.mini.copied { background: var(--primary); color: var(--primary-fg); box-shadow: none; }

main.has-sticky { padding-bottom: calc(6.5rem + var(--safe-bottom)); }

};

function esc(v) {
  return String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
}

function getPass() {
  try { return sessionStorage.getItem(PASS_KEY) || ""; }
  catch (err) { return ""; }
}
function setPass(p) {
  try {
    if (p) sessionStorage.setItem(PASS_KEY, p);
    else sessionStorage.removeItem(PASS_KEY);
  } catch (err) {}
}

async function rpc(name, body) {
  const res = await fetch(SB_URL + "/rest/v1/rpc/" + name, {
    method: "POST",
    headers: {
      apikey: SB_ANON,
      Authorization: "Bearer " + SB_ANON,
      "Content-Type": "application/json"
    },
    body: JSON.stringify(body)
  });
  const text = await res.text();
  let data = null;
  if (text) {
    try { data = JSON.parse(text); }
    catch (err) { data = text; }
  }
  if (!res.ok) {
    const msg = (data && (data.message || data.error || data.hint)) || text || ("HTTP " + res.status);
    const err = new Error(typeof msg === "string" ? msg : "Request failed");
    err.status = res.status;
    err.data = data;
    err.notAllowed = /not allowed/i.test(String(msg));
    err.missing = (data && data.code === "PGRST202") || /Could not find the function/i.test(String(msg));
    throw err;
  }
  return data;
}

function isNotAllowed(err) { return !!(err && (err.notAllowed || /not allowed/i.test(err.message || ""))); }

function clientLink(token) { return TRACKER_ORIGIN + "?c=" + encodeURIComponent(token); }

function dayName(id) { return (DAYS.find((d) => d.id === id) || {}).name || id; }

function trainingDays() { return DAYS.filter((d) => !d.rest); }

function exerciseName(id, state) {
  const plans = state && state.plans ? state.plans : {};
  for (const list of Object.values(plans)) {
    if (!Array.isArray(list)) continue;
    const hit = list.find((e) => e.id === id);
    if (hit && hit.name) return hit.name;
  }
  const lib = state && state.library && state.library[id];
  if (lib && lib.name) return lib.name;
  if (DEFAULT_LIBRARY[id] && DEFAULT_LIBRARY[id].name) return DEFAULT_LIBRARY[id].name;
  return EX_NAMES[id] || id;
}

function foodName(id, state) {
  const custom = (state && state.customFoods) || [];
  const hit = custom.find((f) => f.id === id);
  if (hit && hit.name) return hit.name;
  return FOOD_NAMES[id] || id;
}

function parseNum(v) {
  const t = String(v ?? "").trim().replace(",", ".");
  if (!t) return null;
  const n = Number(t);
  return Number.isFinite(n) ? n : null;
}

function fmtEEE(s) {
  if (!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return s || "";
  const [y, m, d] = s.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  return DOW[dt.getDay()] + " " + d + " " + MONTHS[dt.getMonth()];
}

function fmtWhen(value) {
  if (value == null || value === "") return "Never synced";
  const d = typeof value === "number" ? new Date(value) : new Date(value);
  if (Number.isNaN(d.getTime())) return "Never synced";
  return d.toLocaleString("en-GB", {
    timeZone: "Europe/London",
    weekday: "short",
    day: "numeric",
    month: "short",
    hour: "2-digit",
    minute: "2-digit"
  });
}

function isLogged(session) {
  if (!session) return false;
  if (session.finished) return true;
  return Object.values(session.sets || {}).some((sets) =>
    (sets || []).some((e) => e.done || String(e.weight || "").trim() || String(e.reps || "").trim())
  );
}

function sessionVolume(session) {
  let t = 0;
  for (const sets of Object.values(session.sets || {})) {
    for (const e of sets || []) {
      if (!e.done) continue;
      const w = parseNum(e.weight), r = parseNum(e.reps);
      if (w != null && r != null) t += w * r;
    }
  }
  return t;
}

function bestSet(entries) {
  let best = null;
  for (const e of entries || []) {
    const w = parseNum(e.weight);
    const r = parseNum(e.reps);
    if (w == null || w <= 0) continue;
    if (!best || w > best.weight || (w === best.weight && (r ?? 0) > best.reps)) {
      best = { weight: w, reps: r ?? 0 };
    }
  }
  return best;
}

function liftSummaries(state) {
  const sessions = ((state && state.sessions) || []).filter(isLogged);
  const byEx = new Map();
  for (const s of sessions) {
    for (const [id, sets] of Object.entries(s.sets || {})) {
      const best = bestSet(sets);
      if (!best) continue;
      const prev = byEx.get(id);
      if (!prev || best.weight > prev.weight || (best.weight === prev.weight && best.reps > prev.reps)) {
        byEx.set(id, { id, weight: best.weight, reps: best.reps, date: s.date, unit: s.unit || state.unit || "kg" });
      }
    }
  }
  return [...byEx.values()].sort((a, b) => b.weight - a.weight);
}

function volumeByMuscle(state) {
  const plans = (state && state.plans) || {};
  const map = new Map(MUSCLES.map((m) => [m.id, 0]));
  for (const day of trainingDays()) {
    const list = plans[day.id] || day.exercises || [];
    for (const ex of list) {
      for (const m of ex.muscles || []) {
        if (map.has(m)) map.set(m, map.get(m) + (Number(ex.sets) || 0));
      }
    }
  }
  return MUSCLES.map((m) => ({ id: m.id, name: m.name, sets: map.get(m.id) || 0 })).filter((r) => r.sets > 0);
}

function cloneEx(ex) {
  return {
    id: ex.id,
    name: ex.name,
    sets: Number(ex.sets) || 3,
    reps: ex.reps || "8–12",
    muscles: Array.isArray(ex.muscles) ? [...ex.muscles] : [],
    cue: ex.cue || "",
    setReps: Array.isArray(ex.setReps) ? [...ex.setReps] : undefined
  };
}

function defaultPlan(dayId) {
  const d = DAYS.find((x) => x.id === dayId);
  return ((d && d.exercises) || []).map(cloneEx);
}

function draftFrom(client, state) {
  const plans = {};
  for (const d of trainingDays()) {
    const src = state && state.plans && Array.isArray(state.plans[d.id]) ? state.plans[d.id] : defaultPlan(d.id);
    plans[d.id] = src.map(cloneEx);
  }
  const library = { ...DEFAULT_LIBRARY, ...((state && state.library) || {}) };
  for (const list of Object.values(plans)) {
    for (const ex of list) library[ex.id] = { ...(library[ex.id] || {}), ...ex };
  }
  return {
    name: client && client.name ? client.name : "",
    unit: state && state.unit === "lb" ? "lb" : "kg",
    plans,
    library,
    origName: client && client.name ? client.name : ""
  };
}

function draftsEqual(a, b) {
  return JSON.stringify({ name: a.name, unit: a.unit, plans: a.plans, library: a.library }) ===
    JSON.stringify({ name: b.name, unit: b.unit, plans: b.plans, library: b.library });
}

let ui = {
  view: "gate",
  pass: getPass(),
  passInput: "",
  clients: [],
  selected: null,
  state: null,
  error: "",
  busy: false,
  newName: "",
  justAdded: null,
  copied: "",
  confirmDelete: false,
  draft: null,
  draftSaved: null,
  editDay: "push",
  libQuery: "",
  customOpen: false,
  custom: { name: "", sets: 3, reps: "8–12", muscles: [], cue: "" },
  confirm: null
};

function isDirty() {
  return !!(ui.draft && ui.draftSaved && !draftsEqual(ui.draft, ui.draftSaved));
}

function showError(err, fallback) {
  if (isNotAllowed(err)) {
    ui.pass = "";
    ui.passInput = "";
    setPass("");
    ui.view = "gate";
    ui.error = "That passcode isn’t right. Try again.";
    ui.selected = null;
    ui.state = null;
    ui.draft = null;
    return;
  }
  if (err && err.missing) {
    ui.error = "Plan saving isn’t available yet. The database update still needs to be applied.";
    return;
  }
  ui.error = (err && err.message) || fallback || "Something went wrong. Try again.";
}

async function loadList() {
  ui.busy = true;
  ui.error = "";
  render();
  try {
    const rows = await rpc("coach_list", { p_pass: ui.pass });
    ui.clients = Array.isArray(rows) ? rows : [];
    ui.view = "list";
  } catch (err) {
    showError(err, "Could not load clients.");
  } finally {
    ui.busy = false;
    render();
  }
}

async function addClient(name) {
  const n = String(name || "").trim();
  if (!n) return;
  ui.busy = true;
  ui.error = "";
  render();
  try {
    const token = await rpc("coach_add_client", { p_pass: ui.pass, p_name: n });
    const t = String(token || "").replace(/^"|"$/g, "");
    if (!t) throw new Error("No link was returned.");
    const link = clientLink(t);
    ui.justAdded = { name: n, token: t, link };
    ui.newName = "";
    ui.copied = (await copyToClipboard(link)) ? "new" : "";
    await loadList();
  } catch (err) {
    showError(err, "Could not add that client.");
    ui.busy = false;
    render();
  }
}

async function openClient(client) {
  ui.busy = true;
  ui.error = "";
  ui.confirmDelete = false;
  ui.selected = client;
  ui.state = null;
  ui.view = "detail";
  render();
  try {
    const raw = await rpc("coach_get", { p_pass: ui.pass, p_client: client.id });
    ui.state = raw && typeof raw === "object" ? raw : null;
  } catch (err) {
    showError(err, "Could not load this client.");
  } finally {
    ui.busy = false;
    render();
  }
}

function openEditor() {
  if (!ui.selected) return;
  ui.draft = draftFrom(ui.selected, ui.state);
  ui.draftSaved = JSON.parse(JSON.stringify(ui.draft));
  ui.editDay = trainingDays()[0].id;
  ui.libQuery = "";
  ui.customOpen = false;
  ui.custom = { name: "", sets: 3, reps: "8–12", muscles: [], cue: "" };
  ui.confirm = null;
  ui.error = "";
  ui.view = "edit";
  render();
}

async function savePlan() {
  if (!ui.selected || !ui.draft) return;
  const name = ui.draft.name.trim();
  if (!name) { ui.error = "Enter a name for this client."; render(); return; }
  ui.busy = true;
  ui.error = "";
  ui.confirm = null;
  render();
  try {
    if (name !== ui.draft.origName) {
      await rpc("coach_rename_client", { p_pass: ui.pass, p_client: ui.selected.id, p_name: name });
      ui.selected = { ...ui.selected, name };
      ui.draft.origName = name;
    }
    await rpc("coach_set_plans", {
      p_pass: ui.pass,
      p_client: ui.selected.id,
      p_plans: ui.draft.plans,
      p_library: ui.draft.library,
      p_unit: ui.draft.unit
    });
    ui.draftSaved = JSON.parse(JSON.stringify(ui.draft));
    await openClient(ui.selected);
  } catch (err) {
    showError(err, "Could not save this plan.");
    ui.busy = false;
    if (ui.view !== "gate") ui.view = "edit";
    render();
  }
}

function requestLeaveEditor() {
  if (isDirty()) {
    ui.confirm = { kind: "discard" };
    render();
    return;
  }
  leaveEditor();
}

function leaveEditor() {
  ui.confirm = null;
  ui.draft = null;
  ui.draftSaved = null;
  ui.view = "detail";
  render();
}

async function deleteClient() {
  if (!ui.selected) return;
  ui.busy = true;
  ui.error = "";
  render();
  try {
    await rpc("coach_delete_client", { p_pass: ui.pass, p_client: ui.selected.id });
    ui.selected = null;
    ui.state = null;
    ui.confirmDelete = false;
    ui.draft = null;
    await loadList();
  } catch (err) {
    showError(err, "Could not delete this client.");
    ui.busy = false;
    render();
  }
}

async function copyToClipboard(text) {
  try {
    await Promise.race([
      navigator.clipboard.writeText(text),
      new Promise((_, reject) => setTimeout(() => reject(new Error("clipboard timeout")), 1200))
    ]);
    return true;
  } catch (err) {
    return false;
  }
}

async function copyLink(token, id) {
  const link = clientLink(token);
  const ok = await copyToClipboard(link);
  ui.copied = id;
  if (!ok) ui.justAdded = { name: "Link", token, link };
  render();
  setTimeout(() => { if (ui.copied === id) { ui.copied = ""; render(); } }, 1600);
}

function currentPlan() {
  if (!ui.draft) return [];
  return ui.draft.plans[ui.editDay] || [];
}

function setCurrentPlan(list) {
  ui.draft.plans = { ...ui.draft.plans, [ui.editDay]: list };
}

function patchEx(id, patch) {
  const list = currentPlan().map((ex) => {
    if (ex.id !== id) return ex;
    const next = { ...ex, ...patch };
    if (patch.sets != null) next.sets = Math.min(12, Math.max(1, Math.round(Number(patch.sets)) || ex.sets));
    ui.draft.library = { ...ui.draft.library, [id]: { ...(ui.draft.library[id] || {}), ...next } };
    return next;
  });
  setCurrentPlan(list);
}

function moveEx(id, delta) {
  const plan = currentPlan().slice();
  const i = plan.findIndex((e) => e.id === id);
  const j = i + delta;
  if (i < 0 || j < 0 || j >= plan.length) return;
  const [item] = plan.splice(i, 1);
  plan.splice(j, 0, item);
  setCurrentPlan(plan);
}

function removeEx(id) {
  setCurrentPlan(currentPlan().filter((e) => e.id !== id));
  ui.confirm = null;
}

function addExFromLib(id) {
  const src = ui.draft.library[id] || DEFAULT_LIBRARY[id];
  if (!src) return;
  const existingIds = new Set(currentPlan().map((e) => e.id));
  let ex = cloneEx(src);
  if (existingIds.has(ex.id)) ex.id = "custom-" + (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
  setCurrentPlan(currentPlan().concat([ex]));
  ui.draft.library = { ...ui.draft.library, [ex.id]: ex };
  ui.libQuery = "";
}

function addCustomEx() {
  const name = ui.custom.name.trim();
  if (!name || ui.custom.muscles.length === 0) return;
  const ex = {
    id: "custom-" + (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())),
    name,
    sets: Math.min(12, Math.max(1, Math.round(ui.custom.sets) || 3)),
    reps: ui.custom.reps.trim() || "8–12",
    muscles: [...ui.custom.muscles],
    cue: ui.custom.cue.trim()
  };
  setCurrentPlan(currentPlan().concat([ex]));
  ui.draft.library = { ...ui.draft.library, [ex.id]: ex };
  ui.custom = { name: "", sets: 3, reps: "8–12", muscles: [], cue: "" };
  ui.customOpen = false;
}

function libraryOptions() {
  const q = (ui.libQuery || "").trim().toLowerCase();
  const onDay = new Set(currentPlan().map((e) => e.id));
  const seen = new Set();
  const out = [];
  const pool = { ...DEFAULT_LIBRARY, ...(ui.draft ? ui.draft.library : {}) };
  for (const ex of Object.values(pool)) {
    if (!ex || !ex.id || seen.has(ex.id) || onDay.has(ex.id)) continue;
    seen.add(ex.id);
    if (q && !(ex.name || "").toLowerCase().includes(q)) continue;
    out.push(ex);
  }
  out.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
  return out.slice(0, 12);
}

function renderHeader(sub, backAct) {
  return `<header class="header">
    <div>
      <p class="brand-kicker">Block</p>
      <div class="brand-rule"></div>
      <p class="brand-sub">${esc(sub)}${ui.view === "edit" && isDirty() ? `<span class="dirty-dot" title="Unsaved changes"></span>` : ""}</p>
    </div>
    ${backAct
      ? `<button type="button" class="text-btn" data-act="${esc(backAct)}">${backAct === "leave-edit" ? "Back" : "Clients"}</button>`
      : (ui.view !== "gate" ? `<button type="button" class="text-btn signout" data-act="lock">Lock</button>` : "")}
  </header>`;
}

function renderGate() {
  return `${renderHeader("Coach")}
    <main class="lock">
      <div class="stack-lg">
        <div>
          <h1 class="page-title">Coach</h1>
          <p class="lede">Enter your passcode to see your clients. It stays on this phone until you close the tab.</p>
        </div>
        ${ui.error ? `<p class="err" role="alert">${esc(ui.error)}</p>` : ""}
        <form data-act="unlock" class="stack">
          <label>Passcode
            <input class="pass" type="password" name="pass" autocomplete="current-password" value="${esc(ui.passInput)}" data-keep="pass" ${ui.busy ? "disabled" : ""}>
          </label>
          <button class="btn-primary" type="submit" ${ui.busy ? "disabled" : ""}>${ui.busy ? "Checking…" : "Open coach view"}</button>
        </form>
      </div>
    </main>`;
}

function renderList() {
  const rows = ui.clients.map((c) => {
    const when = c.updated_at ? fmtWhen(c.updated_at) : "No data yet";
    const copied = ui.copied === c.id;
    return `<section class="card">
      <div class="row">
        <button type="button" class="row-main" data-act="open" data-id="${esc(c.id)}">
          <h3>${esc(c.name)}</h3>
          <p>Last updated ${esc(when)}</p>
        </button>
        <button type="button" class="mini${copied ? " copied" : ""}" data-act="copy" data-token="${esc(c.token)}" data-id="${esc(c.id)}">${copied ? "Copied" : "Copy link"}</button>
      </div>
    </section>`;
  }).join("");

  const added = ui.justAdded ? `<p class="ok">Link for ${esc(ui.justAdded.name)} is ready${ui.copied === "new" ? " and copied" : ""}.
    <span class="link-box">${esc(ui.justAdded.link)}</span></p>` : "";

  return `${renderHeader("Coach")}
    <main>
      <div class="stack-lg">
        <div>
          <h1 class="page-title">Clients</h1>
          <p class="lede">Send each person their private link. Open a client to view their log or edit their plan.</p>
        </div>
        ${ui.error ? `<p class="err" role="alert">${esc(ui.error)}</p>` : ""}
        ${added}
        <form data-act="add" class="add stack">
          <label>Add a client
            <input class="field" name="name" placeholder="Name" value="${esc(ui.newName)}" data-keep="name" ${ui.busy ? "disabled" : ""}>
          </label>
          <button class="btn-primary" type="submit" ${ui.busy || !ui.newName.trim() ? "disabled" : ""}>Create link</button>
        </form>
        <div class="stack">
          ${rows || `<p class="empty">No clients yet. Add a name to create a private link.</p>`}
        </div>
      </div>
    </main>`;
}

function setLines(sets, unit) {
  return (sets || []).map((e, i) => {
    const w = String(e.weight || "").trim();
    const r = String(e.reps || "").trim();
    const bits = [];
    if (w) bits.push(w + (unit ? " " + unit : ""));
    if (r) bits.push(r + " reps");
    const body = bits.length ? bits.join(" × ") : "—";
    return `<p class="set-line"><span class="${e.done ? "done" : ""}">Set ${i + 1}: ${esc(body)}${e.done ? " ✓" : ""}</span></p>`;
  }).join("");
}

function renderSessions(state) {
  const sessions = ((state && state.sessions) || []).filter(isLogged)
    .slice()
    .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (b.updatedAt || 0) - (a.updatedAt || 0)))
    .slice(0, 12);
  if (!sessions.length) return `<p class="empty">No sessions logged yet.</p>`;
  return sessions.map((s) => {
    const unit = s.unit || state.unit || "kg";
    const vol = sessionVolume(s);
    const ids = Object.keys(s.sets || {});
    const planIds = ((state.plans || {})[s.dayId] || []).map((e) => e.id);
    const order = [...planIds.filter((id) => ids.includes(id)), ...ids.filter((id) => !planIds.includes(id))];
    const body = order.map((id) => {
      const sets = s.sets[id] || [];
      if (!sets.some((e) => e.done || String(e.weight || "").trim() || String(e.reps || "").trim())) return "";
      return `<li><p class="ex-l">${esc(exerciseName(id, state))}</p>${setLines(sets, unit)}</li>`;
    }).join("");
    return `<section class="card">
      <div class="row">
        <div class="row-main">
          <h3>${esc(dayName(s.dayId))}</h3>
          <p>${esc(fmtEEE(s.date))}${s.finished ? " · Finished" : ""}</p>
        </div>
        <div>
          <p class="kicker">Volume</p>
          <p style="margin:.2rem 0 0;font-family:var(--font-display);font-size:1.35rem;color:var(--primary);font-variant-numeric:tabular-nums">${esc(vol ? String(Math.round(vol)) : "—")}</p>
        </div>
      </div>
      <ul class="stack" style="margin:.85rem 0 0;padding:0;list-style:none">${body}</ul>
    </section>`;
  }).join("");
}

function renderLifts(state) {
  const lifts = liftSummaries(state).slice(0, 12);
  const vol = volumeByMuscle(state);
  const liftBlock = lifts.length
    ? `<div class="stack">${lifts.map((l) => `<div class="row"><div class="row-main"><h3 style="font-size:1.15rem">${esc(exerciseName(l.id, state))}</h3><p>${esc(fmtEEE(l.date))}</p></div><p style="margin:0;font-family:var(--font-display);font-size:1.25rem;color:var(--primary);font-variant-numeric:tabular-nums">${esc(l.weight)} ${esc(l.unit)} × ${esc(l.reps)}</p></div>`).join("")}</div>`
    : `<p class="empty">No lift history yet.</p>`;
  const volBlock = vol.length
    ? `<div class="stat-grid" style="margin-top:1rem">${vol.map((r) => `<div class="stat"><p class="lbl">${esc(r.name)}</p><p class="val">${esc(r.sets)} <span style="font-size:.8rem;color:var(--muted)">sets</span></p></div>`).join("")}</div>`
    : "";
  return `<section class="card">${liftBlock}${volBlock}</section>`;
}

function renderCheckIns(state) {
  const weights = (state && state.weights) || {};
  const checkIns = (state && state.checkIns) || {};
  const dates = [...new Set([...Object.keys(weights), ...Object.keys(checkIns)])]
    .filter((d) => /^\d{4}-\d{2}-\d{2}$/.test(d))
    .sort((a, b) => a < b ? 1 : -1)
    .slice(0, 14);
  if (!dates.length) return `<p class="empty">No check-ins yet.</p>`;
  const unit = (state && state.unit) || "kg";
  return `<section class="card"><div class="stack">${dates.map((d) => {
    const ci = checkIns[d] || {};
    const bits = [];
    if (weights[d]) bits.push(weights[d] + " " + unit);
    if (ci.steps) bits.push(ci.steps + " steps");
    if (ci.sleep) bits.push(ci.sleep + " h sleep");
    if (ci.recovery) bits.push("recovery " + ci.recovery);
    return `<div class="row"><div class="row-main"><h3 style="font-size:1.15rem">${esc(fmtEEE(d))}</h3><p>${esc(bits.join(" · ") || "—")}</p></div></div>`;
  }).join("")}</div></section>`;
}

function renderMeals(state) {
  const meals = (state && state.meals) || [];
  const has = meals.some((m) => (m.items && m.items.length) || (m.name && !/^Meal \d+$/.test(m.name)));
  if (!has) return `<p class="empty">No meals logged yet. This is their current meal list, not a history.</p>`;
  return meals.map((m, i) => {
    const items = (m.items || []).map((it) => `<div class="meal-item"><span>${esc(foodName(it.foodId, state))}</span><span>${esc(it.grams)} g</span></div>`).join("");
    return `<section class="card"><p class="kicker">Meal ${i + 1}</p><h3 style="margin:.25rem 0 0;font-family:var(--font-display);font-size:1.35rem">${esc(m.name || "Meal")}</h3>${items || `<p class="empty" style="margin-top:.5rem">Empty</p>`}</section>`;
  }).join("");
}

function renderDetail() {
  const c = ui.selected || { name: "Client" };
  const state = ui.state;
  const last = (state && state.updatedAt) ? fmtWhen(state.updatedAt) : (c.updated_at ? fmtWhen(c.updated_at) : "Never synced");
  const sessions = ((state && state.sessions) || []).filter(isLogged);
  return `${renderHeader("Client", "back")}
    <main>
      <div class="stack-lg">
        <div>
          <h1 class="page-title">${esc(c.name)}</h1>
          <p class="lede">Last synced ${esc(last)}. ${esc(sessions.length)} logged session${sessions.length === 1 ? "" : "s"}.</p>
        </div>
        ${ui.error ? `<p class="err" role="alert">${esc(ui.error)}</p>` : ""}
        <button type="button" class="btn-primary" data-act="edit-plan">Edit plan</button>
        ${ui.busy && !state ? `<p class="empty">Loading…</p>` : ""}
        ${!ui.busy && !state ? `<p class="empty">No data synced yet. You can still edit their plan, or wait until they open their link and log a session.</p>` : ""}
        ${state ? `
          <div>
            <h2 class="section-title">Recent sessions</h2>
            <div class="stack">${renderSessions(state)}</div>
          </div>
          <div>
            <h2 class="section-title">Lifts and volume</h2>
            ${renderLifts(state)}
          </div>
          <div>
            <h2 class="section-title">Check-ins</h2>
            ${renderCheckIns(state)}
          </div>
          <div>
            <h2 class="section-title">Meals</h2>
            <div class="stack">${renderMeals(state)}</div>
          </div>
        ` : ""}
        <div>
          <button type="button" class="mini" data-act="copy" data-token="${esc(c.token)}" data-id="${esc(c.id)}" style="margin-bottom:1rem">${ui.copied === c.id ? "Copied" : "Copy their link"}</button>
          ${ui.confirmDelete
            ? `<div class="stack"><p class="err">Delete ${esc(c.name)} and all of their stored data? This cannot be undone.</p>
                <button type="button" class="btn-danger" data-act="delete-yes" ${ui.busy ? "disabled" : ""}>Yes, delete</button>
                <button type="button" class="btn-line" data-act="delete-no">Cancel</button></div>`
            : `<button type="button" class="btn-danger" data-act="delete-ask">Delete client</button>`}
        </div>
      </div>
    </main>`;
}

function renderEdit() {
  const d = ui.draft;
  const day = DAYS.find((x) => x.id === ui.editDay) || trainingDays()[0];
  const plan = d.plans[day.id] || [];
  const chips = trainingDays().map((x) =>
    `<button type="button" class="chip${x.id === day.id ? " active" : ""}" data-act="edit-day" data-id="${esc(x.id)}"><span>${esc(x.short)}</span></button>`
  ).join("");
  const rows = plan.map((ex, i) => {
    const removing = ui.confirm && ui.confirm.kind === "remove" && ui.confirm.id === ex.id;
    return `<section class="card ex-edit">
      <div class="ex-edit-top">
        <div class="grow">
          <label class="kicker">Exercise ${i + 1}
            <input class="name-input mt-2" value="${esc(ex.name)}" data-keep="ex-name" data-id="${esc(ex.id)}" ${ui.busy ? "disabled" : ""}>
          </label>
        </div>
        <button type="button" class="icon-btn" aria-label="Move up" data-act="ex-up" data-id="${esc(ex.id)}" ${i === 0 || ui.busy ? "disabled" : ""}>${ICONS.up}</button>
        <button type="button" class="icon-btn" aria-label="Move down" data-act="ex-down" data-id="${esc(ex.id)}" ${i === plan.length - 1 || ui.busy ? "disabled" : ""}>${ICONS.down}</button>
        <button type="button" class="icon-btn" aria-label="Remove" data-act="ex-remove" data-id="${esc(ex.id)}" ${ui.busy ? "disabled" : ""}>${ICONS.trash}</button>
      </div>
      ${removing ? `<div class="stack"><p class="err">Remove ${esc(ex.name)} from ${esc(day.name)}?</p>
        <button type="button" class="btn-danger" data-act="ex-remove-yes" data-id="${esc(ex.id)}">Remove</button>
        <button type="button" class="btn-line" data-act="confirm-no">Cancel</button></div>` : ""}
      <div class="set-ctrl">
        <button type="button" class="icon-btn" aria-label="Fewer sets" data-act="ex-sets" data-id="${esc(ex.id)}" data-delta="-1" ${ex.sets <= 1 || ui.busy ? "disabled" : ""}>${ICONS.minus}</button>
        <span class="set-count">${ex.sets} sets</span>
        <button type="button" class="icon-btn" aria-label="More sets" data-act="ex-sets" data-id="${esc(ex.id)}" data-delta="1" ${ex.sets >= 12 || ui.busy ? "disabled" : ""}>${ICONS.plus}</button>
        <input class="field center" value="${esc(ex.reps)}" aria-label="Rep range" data-keep="ex-reps" data-id="${esc(ex.id)}" ${ui.busy ? "disabled" : ""}>
      </div>
      <label class="kicker">Notes / cue
        <input class="cue-input" value="${esc(ex.cue || "")}" placeholder="Optional cue" data-keep="ex-cue" data-id="${esc(ex.id)}" ${ui.busy ? "disabled" : ""}>
      </label>
    </section>`;
  }).join("");

  const lib = libraryOptions();
  const libBlock = `<section class="card">
    <p class="kicker">Add from library</p>
    <input class="field mt-2" placeholder="Search exercises" value="${esc(ui.libQuery)}" data-keep="libQuery" ${ui.busy ? "disabled" : ""}>
    <ul class="lib-list">${lib.length ? lib.map((ex) =>
      `<li><button type="button" data-act="add-lib" data-id="${esc(ex.id)}">${esc(ex.name)} <span class="muted">${esc(ex.sets)} × ${esc(ex.reps)}</span></button></li>`
    ).join("") : `<li class="empty" style="padding:.5rem 0">No matches.</li>`}</ul>
    <button type="button" class="linkish btn-line" style="margin-top:.75rem" data-act="toggle-custom">${ui.customOpen ? "Close custom" : "Add a custom exercise"}</button>
    ${ui.customOpen ? `<div class="stack" style="margin-top:.75rem">
      <input class="field" placeholder="Exercise name" value="${esc(ui.custom.name)}" data-keep="cu-name">
      <div class="set-ctrl">
        <button type="button" class="icon-btn" data-act="cu-sets" data-delta="-1">${ICONS.minus}</button>
        <span class="set-count">${ui.custom.sets} sets</span>
        <button type="button" class="icon-btn" data-act="cu-sets" data-delta="1">${ICONS.plus}</button>
        <input class="field center" value="${esc(ui.custom.reps)}" data-keep="cu-reps" aria-label="Custom rep range">
      </div>
      <div class="muscle-row">${MUSCLES.map((m) =>
        `<button type="button" class="pill${ui.custom.muscles.includes(m.id) ? " on" : ""}" data-act="cu-muscle" data-id="${esc(m.id)}">${esc(m.name)}</button>`
      ).join("")}</div>
      <input class="cue-input" placeholder="Optional cue" value="${esc(ui.custom.cue)}" data-keep="cu-cue">
      <button type="button" class="btn-primary" data-act="add-custom" ${!ui.custom.name.trim() || !ui.custom.muscles.length || ui.busy ? "disabled" : ""}>Add to ${esc(day.short)}</button>
    </div>` : ""}
  </section>`;

  const confirmDiscard = ui.confirm && ui.confirm.kind === "discard" ? `<div class="card stack"><p class="err">Discard unsaved changes to this plan?</p>
    <button type="button" class="btn-danger" data-act="discard-yes">Discard</button>
    <button type="button" class="btn-line" data-act="confirm-no">Keep editing</button></div>` : "";

  return `${renderHeader("Edit plan", "leave-edit")}
    <main class="has-sticky">
      <div class="stack-lg">
        <div>
          <h1 class="page-title">Edit plan</h1>
          <p class="lede">Changes show on ${d.origName ? esc(d.origName) + "’s" : "their"} link the next time they open it. Unsynced sessions they have already logged are kept.</p>
        </div>
        ${ui.error ? `<p class="err" role="alert">${esc(ui.error)}</p>` : ""}
        ${confirmDiscard}
        <section class="card stack">
          <label>Client name
            <input class="field" value="${esc(d.name)}" data-keep="draft-name" ${ui.busy ? "disabled" : ""}>
          </label>
          <p class="kicker">Units</p>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem">
            <button type="button" class="${d.unit === "kg" ? "btn-primary" : "btn-line"}" data-act="unit" data-unit="kg">kg</button>
            <button type="button" class="${d.unit === "lb" ? "btn-primary" : "btn-line"}" data-act="unit" data-unit="lb">lb</button>
          </div>
        </section>
        <div class="chips">${chips}</div>
        <div>
          <h2 class="section-title">${esc(day.name)}</h2>
          <p class="lede">${plan.length} exercise${plan.length === 1 ? "" : "s"} this day.</p>
        </div>
        <div class="stack">${rows || `<p class="empty">No exercises on this day yet.</p>`}</div>
        ${libBlock}
      </div>
      <div class="sticky-actions">
        <button type="button" class="btn-line" data-act="leave-edit" ${ui.busy ? "disabled" : ""}>Discard</button>
        <button type="button" class="btn-primary" data-act="save-plan" ${ui.busy || !isDirty() ? "disabled" : ""}>${ui.busy ? "Saving…" : "Save"}</button>
      </div>
    </main>`;
}

function render() {
  const root = document.getElementById("app");
  const focused = document.activeElement;
  const keep = focused && focused.dataset && focused.dataset.keep;
  const keepId = focused && focused.dataset && focused.dataset.id;
  const selStart = focused && focused.selectionStart;
  const selEnd = focused && focused.selectionEnd;
  let html = "";
  if (ui.view === "gate") html = renderGate();
  else if (ui.view === "detail") html = renderDetail();
  else if (ui.view === "edit") html = renderEdit();
  else html = renderList();
  root.innerHTML = `<div class="app">${html}</div>`;
  if (keep) {
    const el = [...document.querySelectorAll("[data-keep]")].find((e) => e.dataset.keep === keep && (!keepId || e.dataset.id === keepId));
    if (el) {
      el.focus();
      if (typeof selStart === "number" && el.setSelectionRange) {
        try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }
}

function onClick(e) {
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  if (btn.tagName === "BUTTON" && btn.closest("form") && btn.type !== "submit") e.preventDefault();
  const act = btn.dataset.act;
  if (act === "back") { ui.view = "list"; ui.selected = null; ui.state = null; ui.confirmDelete = false; ui.error = ""; render(); }
  else if (act === "lock") { ui.pass = ""; ui.passInput = ""; setPass(""); ui.view = "gate"; ui.clients = []; ui.selected = null; ui.state = null; ui.draft = null; ui.error = ""; render(); }
  else if (act === "open") {
    const c = ui.clients.find((x) => x.id === btn.dataset.id);
    if (c) openClient(c);
  }
  else if (act === "copy") copyLink(btn.dataset.token, btn.dataset.id);
  else if (act === "edit-plan") openEditor();
  else if (act === "leave-edit") requestLeaveEditor();
  else if (act === "discard-yes") leaveEditor();
  else if (act === "save-plan") savePlan();
  else if (act === "edit-day") { ui.editDay = btn.dataset.id; ui.confirm = null; render(); }
  else if (act === "unit") { ui.draft.unit = btn.dataset.unit; render(); }
  else if (act === "ex-up") { moveEx(btn.dataset.id, -1); render(); }
  else if (act === "ex-down") { moveEx(btn.dataset.id, 1); render(); }
  else if (act === "ex-remove") { ui.confirm = { kind: "remove", id: btn.dataset.id }; render(); }
  else if (act === "ex-remove-yes") { removeEx(btn.dataset.id); render(); }
  else if (act === "confirm-no") { ui.confirm = null; render(); }
  else if (act === "ex-sets") { const ex = currentPlan().find((x) => x.id === btn.dataset.id); if (ex) { patchEx(ex.id, { sets: ex.sets + Number(btn.dataset.delta) }); render(); } }
  else if (act === "add-lib") { addExFromLib(btn.dataset.id); render(); }
  else if (act === "toggle-custom") { ui.customOpen = !ui.customOpen; render(); }
  else if (act === "cu-sets") { ui.custom.sets = Math.min(12, Math.max(1, ui.custom.sets + Number(btn.dataset.delta))); render(); }
  else if (act === "cu-muscle") {
    ui.custom.muscles = ui.custom.muscles.includes(btn.dataset.id)
      ? ui.custom.muscles.filter((id) => id !== btn.dataset.id)
      : [...ui.custom.muscles, btn.dataset.id];
    render();
  }
  else if (act === "add-custom") { addCustomEx(); render(); }
  else if (act === "delete-ask") { ui.confirmDelete = true; render(); }
  else if (act === "delete-no") { ui.confirmDelete = false; render(); }
  else if (act === "delete-yes") deleteClient();
}

function onInput(e) {
  const el = e.target;
  if (!el.dataset.keep) return;
  const keep = el.dataset.keep;
  const val = el.value;
  if (keep === "pass") ui.passInput = val;
  else if (keep === "name") {
    ui.newName = val;
    const btn = document.querySelector("form[data-act=add] .btn-primary");
    if (btn) btn.disabled = ui.busy || !ui.newName.trim();
  }
  else if (keep === "draft-name") ui.draft.name = val;
  else if (keep === "ex-name") patchEx(el.dataset.id, { name: val });
  else if (keep === "ex-reps") patchEx(el.dataset.id, { reps: val });
  else if (keep === "ex-cue") patchEx(el.dataset.id, { cue: val });
  else if (keep === "libQuery") { ui.libQuery = val; render(); }
  else if (keep === "cu-name") {
    ui.custom.name = val;
    const btn = document.querySelector("[data-act=add-custom]");
    if (btn) btn.disabled = ui.busy || !ui.custom.name.trim() || !ui.custom.muscles.length;
  }
  else if (keep === "cu-reps") ui.custom.reps = val;
  else if (keep === "cu-cue") ui.custom.cue = val;
}

function onSubmit(e) {
  const form = e.target.closest("form[data-act]");
  if (!form) return;
  e.preventDefault();
  if (form.dataset.act === "unlock") {
    const val = (form.pass && form.pass.value ? form.pass.value : ui.passInput).trim();
    if (!val) { ui.error = "Enter your passcode."; render(); return; }
    ui.pass = val;
    ui.passInput = val;
    setPass(val);
    loadList();
  } else if (form.dataset.act === "add") {
    addClient(ui.newName);
  }
}

document.addEventListener("click", onClick);
document.addEventListener("input", onInput);
document.addEventListener("submit", onSubmit);

if (ui.pass) loadList();
else render();

</script>
</body>
</html>
